<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a9ec8">
  <title>PROFILE // ESMAIWOL.ZN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue-banner: #6b9fd4;
      --panel-gray: #c8c8c8;
      --panel-light: #dcdcdc;
      --ink: #222;
      --bezel: #1a1a1c;
      --bezel-hi: #3a3a3e;
      --silver: #c5c9ce;
      --silver-dk: #8e949c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #c8e4f8, transparent 60%),
        linear-gradient(180deg, #8ec4e8 0%, #5a9acc 50%, #3a7aaa 100%);
    }
    a { color: #1a5a9a; }
    .page { width: min(920px, calc(100% - 12px)); margin: 12px auto 40px; }
    .nav { margin-bottom: 12px; font-size: 13px; font-weight: 600; }
    .nav a { margin-right: 12px; text-decoration: none; color: #0a3a60; }

    /* ===== CSS Xperia Play shell ===== */
    .xperia {
      width: min(780px, 100%);
      margin: 0 auto;
      filter: drop-shadow(0 16px 28px rgba(0,15,35,0.4));
    }
    /* Top handset body */
    .xperia-body {
      background: linear-gradient(180deg, #2a2a2e 0%, #141416 55%, #0e0e10 100%);
      border-radius: 28px 28px 18px 18px;
      border: 2px solid #0a0a0c;
      padding: 14px 16px 12px;
      position: relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -2px 6px rgba(0,0,0,0.5);
    }
    .xperia-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 8px;
      color: #888;
      font: 600 10px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
    }
    .xperia-topbar .brand { color: #aaa; font-size: 11px; }
    .xperia-topbar .clock { color: #777; }

    /* Exact screen — everything lives here */
    .phone-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      background: #c8c8c8;
      border: 2px solid #050506;
      box-shadow:
        inset 0 0 0 1px #333,
        0 0 0 1px #111;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    /* Speaker grille + sensors */
    .xperia-chin {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
      height: 22px;
    }
    .xperia-chin .spk {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, #222 0 2px, #444 2px 3px);
    }
    .xperia-chin .led {
      width: 6px; height: 6px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a4, #060);
    }

    /* Gamepad dock */
    .xperia-pad {
      margin-top: -2px;
      background: linear-gradient(180deg, #d0d4d8 0%, #a8 greyscale);
      background: linear-gradient(180deg, #d2d6da 0%, #9ea4ac 45%, #7a8088 100%);
      border-radius: 0 0 26px 26px;
      border: 2px solid #6a7078;
      border-top: 0;
      padding: 14px 18px 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.45);
    }
    .pad-left, .pad-right { display: flex; justify-content: center; }
    .dpad {
      width: 88px; height: 88px;
      position: relative;
    }
    .dpad span {
      position: absolute;
      background: linear-gradient(180deg, #e8ecef, #9aa1a8);
      border: 1px solid #6a7078;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.25);
    }
    .dpad .n { left: 28px; top: 4px; width: 32px; height: 36px; border-radius: 5px 5px 2px 2px; }
    .dpad .s { left: 28px; bottom: 4px; width: 32px; height: 36px; border-radius: 2px 2px 5px 5px; }
    .dpad .w { left: 4px; top: 28px; width: 36px; height: 32px; border-radius: 5px 2px 2px 5px; }
    .dpad .e { right: 4px; top: 28px; width: 36px; height: 32px; border-radius: 2px 5px 5px 2px; }
    .dpad .c {
      left: 30px; top: 30px; width: 28px; height: 28px; border-radius: 4px;
      background: linear-gradient(180deg, #c8ccd0, #888e96);
    }
    .pad-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .pad-mid .selects {
      display: flex; gap: 14px;
    }
    .pad-mid .sel {
      width: 28px; height: 10px; border-radius: 3px;
      background: linear-gradient(180deg, #bbb, #777);
      border: 1px solid #555;
    }
    .pad-mid .logo {
      font: 700 9px/1 "Segoe UI", sans-serif;
      color: #5a6068;
      letter-spacing: 0.08em;
    }
    .buttons {
      width: 88px; height: 88px;
      position: relative;
    }
    .buttons i {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #e8ecef, #9aa1a8);
      border: 1px solid #6a7078;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.25);
      font: 700 11px/28px "Segoe UI", sans-serif;
      text-align: center;
      color: #444;
    }
    .buttons .t { left: 30px; top: 2px; }
    .buttons .x { left: 2px; top: 30px; }
    .buttons .o { right: 2px; top: 30px; }
    .buttons .s { left: 30px; bottom: 2px; }

    /* ===== Profile UI inside screen ===== */
    .pf-banner {
      position: relative;
      flex: 0 0 40%;
      min-height: 96px;
      background-color: var(--blue-banner);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px 8px;
      gap: 12px;
    }
    .pf-banner.has-wp { background-color: #333; }
    .pf-actions {
      position: absolute;
      top: 8px; right: 8px;
      display: flex; gap: 4px; z-index: 2;
    }
    .pf-actions button {
      font: 600 10px/1 "Segoe UI", sans-serif;
      padding: 4px 8px;
      border: 1px solid #999;
      background: linear-gradient(180deg, #f4f4f4, #d0d0d0);
      color: #222;
      cursor: pointer;
      border-radius: 2px;
    }
    .pf-avatar {
      width: 68px; height: 68px;
      flex-shrink: 0;
      border: 2px solid #fff;
      background: #e8eef4;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .pf-nameblock { min-width: 0; padding-bottom: 2px; }
    .pf-name {
      margin: 0;
      font-size: clamp(15px, 2.2vw, 22px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pf-handle {
      margin: 2px 0 0;
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .pf-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--panel-gray);
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
      flex-shrink: 0;
    }
    .pf-stats > div {
      text-align: center;
      padding: 6px 2px 5px;
      border-right: 1px solid #b0b0b0;
    }
    .pf-stats > div:last-child { border-right: 0; }
    .pf-stats b { display: block; font-size: 14px; color: #1a1a1a; line-height: 1.2; }
    .pf-stats span { font-size: 9px; color: #444; }

    .pf-btns {
      display: flex; gap: 6px;
      padding: 7px 10px;
      background: var(--panel-light);
      border-bottom: 1px solid #bbb;
      flex-shrink: 0;
    }
    .pf-btns button {
      font: 600 11px/1 "Segoe UI", sans-serif;
      padding: 5px 12px;
      border: 1px solid #888;
      background: linear-gradient(180deg, #f6f6f6, #d4d4d4);
      border-radius: 2px;
      cursor: pointer;
      color: #222;
    }

    .pf-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      background: #c0c0c0;
      border-bottom: 1px solid #999;
      flex-shrink: 0;
    }
    .pf-tabs button {
      border: 0;
      border-right: 1px solid #aaa;
      background: #d8d8d8;
      padding: 6px 10px;
      font: 600 10px/1 "Segoe UI", sans-serif;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .pf-tabs button.on { background: #ececec; color: #111; }

    .pf-body {
      flex: 1;
      background: #ececec;
      padding: 10px 12px;
      overflow: auto;
      font-size: 12px;
      color: #222;
      min-height: 0;
    }
    .pf-body p { margin: 0 0 8px; white-space: pre-wrap; }

    .about-view { display: block; }
    .about-edit { display: none; }
    .about-mode-edit .about-view { display: none; }
    .about-mode-edit .about-edit { display: block; }

    .edit-form label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #444;
      margin: 8px 0 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .edit-form input, .edit-form textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #999;
      border-radius: 2px;
      font: 12px "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }
    .edit-form textarea { min-height: 56px; resize: vertical; }
    .edit-form .row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px;
    }
    .btn-save, .btn-edit-about {
      border: 1px solid #2a6a9a;
      background: linear-gradient(180deg, #6ab0e0, #3a80b0);
      color: #fff;
      font: 700 12px "Segoe UI", sans-serif;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-edit-about {
      border-color: #666;
      background: linear-gradient(180deg, #f0f0f0, #c8c8c8);
      color: #222;
      margin-top: 6px;
    }
    .btn-save:disabled { opacity: 0.6; cursor: wait; }
    .status { font-size: 11px; }
    .status.ok { color: #0a7040; }
    .status.error { color: #a02030; }
    .hidden { display: none !important; }
    .hint { font-size: 10px; color: #555; margin-top: 6px; }
    .hint code { background: #ddd; padding: 1px 4px; border-radius: 2px; }

    @media (max-width: 560px) {
      .xperia-body { padding: 10px 10px 8px; border-radius: 20px 20px 14px 14px; }
      .xperia-body::before { display: none; }
      .pf-avatar { width: 52px; height: 52px; }
      .dpad, .buttons { width: 70px; height: 70px; transform: scale(0.9); }
      .pf-stats span { font-size: 8px; }
      .pf-stats b { font-size: 12px; }
    }

    .profile-entry { padding: 10px 2px; border-bottom: 1px solid #c7c7c7; }
    .profile-entry:last-child { border-bottom: 0; }
    .profile-entry-title { font-weight: bold; margin-bottom: 4px; color: #222; }
    .profile-entry-meta { color: #666; font-size: 11px; margin-bottom: 5px; }
    .profile-entry-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .profile-entry-media { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .profile-entry-media img { max-width:150px; max-height:120px; object-fit:cover; }
    .profile-entry-media video { max-width:220px; max-height:150px; }
    .profile-empty, .profile-error { padding:10px 0; color:#555; }
    .profile-error { color:#a22; }
    .profile-entry-title a, .profile-entry-actions a { color:inherit; text-decoration:underline; }
    .profile-entry-actions { margin-top:7px; font-size:11px; }
    .profile-summary { padding:7px; background:#ddd; border:1px solid #aaa; }
    .profile-media-counts { display:flex; flex-wrap:wrap; gap:12px; padding:8px; margin-bottom:8px; background:#ddd; border:1px solid #aaa; font-size:11px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <a href="index.html">← Index</a>
      <a href="forum.html">Forum</a>
      <a href="chat.html">Chat</a>
      <a href="login.html">Login</a>
    </div>

    <div class="xperia">
      <div class="xperia-body">
        <div class="xperia-topbar">
          <span class="brand">XPERIA PLAY</span>
          <span class="clock" id="xperia-clock">12:00</span>
        </div>
        <div class="phone-screen" id="phone-screen">
          <div class="pf-banner" id="pf-banner">
            <div class="pf-actions">
              <button type="button" id="btn-report">Report</button>
              <button type="button" id="btn-edit-banner" class="hidden">Edit profile banner</button>
            </div>
            <img class="pf-avatar" id="pf-avatar" src="default-avatar.jpeg" alt="Avatar">
            <div class="pf-nameblock">
              <p class="pf-name" id="pf-name">USER</p>
              <p class="pf-handle" id="pf-handle">@user</p>
            </div>
          </div>

          <div class="pf-stats">
            <div><b id="stat-messages">0</b><span>Messages</span></div>
            <div><b id="stat-media">0</b><span>Media</span></div>
            <div><b id="stat-react">0</b><span>Reaction score</span></div>
            <div><b id="stat-awards">0</b><span>Awards</span></div>
          </div>

          <div class="pf-btns">
            <button type="button" id="btn-dm">Send direct message</button>
            <button type="button" id="btn-find">Find ▾</button>
          </div>

          <div class="pf-tabs">
            <button type="button" data-tab="activity">Latest activity</button>
            <button type="button" data-tab="posts">Postings</button>
            <button type="button" data-tab="media">Media</button>
            <button type="button" data-tab="awards">Awards</button>
            <button type="button" class="on" data-tab="about">About</button>
            <button type="button" data-tab="edit" id="tab-edit-btn" class="hidden">Edit</button>
          </div>

          <div class="pf-body" id="tab-about">
            <div class="about-view">
              <p id="about-text">No bio yet.</p>
              <button type="button" class="btn-edit-about hidden" id="btn-edit-about">Edit About me</button>
              <p class="hint">Public: <code id="share-url">profile.html?u=username</code></p>
            </div>
            <div class="about-edit">
              <form class="edit-form" id="form-about">
                <label for="bio-about">About me</label>
                <textarea id="bio-about" maxlength="500" placeholder="Write your About me…"></textarea>
                <div class="row">
                  <button type="submit" class="btn-save" id="btn-save-about">Save About</button>
                  <button type="button" class="btn-edit-about" id="btn-cancel-about">Cancel</button>
                  <span class="status" id="status-about"></span>
                </div>
              </form>
            </div>
          </div>
          <div class="pf-body hidden" id="tab-activity"><p>No recent activity.</p></div>
          <div class="pf-body hidden" id="tab-posts"><p>Loading postings…</p></div>
          <div class="pf-body hidden" id="tab-media"><p>Loading media…</p></div>
          <div class="pf-body hidden" id="tab-awards"><p>No awards yet.</p></div>
          <div class="pf-body hidden" id="tab-edit">
            <form class="edit-form" id="form-profile">
              <label for="avatar-file">Profile picture (PFP)</label>
              <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <label for="banner-file">Banner / wallpaper</label>
              <input id="banner-file" type="file" accept="image/jpeg,image/png,image/webp">
              <label for="username">Username</label>
              <input id="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required>
              <label for="display-name">Display name</label>
              <input id="display-name" maxlength="48">
              <label for="bio">Bio (About)</label>
              <textarea id="bio" maxlength="500" placeholder="A few lines about you…"></textarea>
              <div class="row">
                <button type="submit" class="btn-save" id="btn-save">Save profile</button>
                <span class="status" id="status"></span>
              </div>
              <p class="hint">Saved in Supabase. Others: <code>profile.html?u=yourname</code></p>
            </form>
          </div>
        </div>
        <div class="xperia-chin">
          <div class="spk"></div>
          <div class="led"></div>
          <div class="spk"></div>
        </div>
      </div>
      <div class="xperia-pad">
        <div class="pad-left">
          <div class="dpad" aria-hidden="true">
            <span class="n"></span><span class="s"></span><span class="w"></span><span class="e"></span><span class="c"></span>
          </div>
        </div>
        <div class="pad-mid">
          <div class="selects"><div class="sel"></div><div class="sel"></div></div>
          <div class="logo">PLAY</div>
        </div>
        <div class="pad-right">
          <div class="buttons" aria-hidden="true">
            <i class="t">△</i><i class="x">□</i><i class="o">○</i><i class="s">×</i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const AVATAR_BUCKET = "avatars";
    const DEFAULT_AVATAR = "default-avatar.jpeg";
    const PROFILE_COLS = "id, username, display_name, bio, avatar_url, banner_url, background_url, created_at";
    const PROFILE_BASE_COLS = "id, username, display_name, bio, avatar_url, created_at";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage
      }
    });
    const $ = (id) => document.getElementById(id);
    let session = null;
    let isOwn = false;
    let hasBannerCol = true;

    function tickClock() {
      const el = $("xperia-clock");
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    tickClock();
    setInterval(tickClock, 15000);

    function setStatus(id, msg, type) {
      const el = $(id);
      if (!el) return;
      el.textContent = msg || "";
      el.className = "status" + (type ? " " + type : "");
    }

    function paint(p) {
      p = p || {};
      const nick = p.display_name || p.username || "USER";
      $("pf-name").textContent = nick;
      $("pf-handle").textContent = p.username ? "@" + p.username : "@user";
      $("about-text").textContent = p.bio || "No bio yet.";
      if ($("bio-about")) $("bio-about").value = p.bio || "";
      $("share-url").textContent = new URL("profile.html?u=" + encodeURIComponent(p.username || "username"), location.href).href;

      const av = $("pf-avatar");
      av.src = p.avatar_url || DEFAULT_AVATAR;
      av.onerror = () => { av.src = DEFAULT_AVATAR; };

      const ban = $("pf-banner");
      const wall = p.banner_url || p.background_url;
      if (wall) {
        ban.style.backgroundImage = "url('" + String(wall).replace(/'/g, "%27") + "')";
        ban.classList.add("has-wp");
      } else {
        ban.style.backgroundImage = "none";
        ban.classList.remove("has-wp");
      }

      $("stat-messages").textContent = p.messages_count != null ? p.messages_count : "0";
      $("stat-media").textContent = p.media_count != null ? p.media_count : "0";
      $("stat-react").textContent = p.reaction_score != null ? p.reaction_score : "0";
      $("stat-awards").textContent = p.awards_count != null ? p.awards_count : "0";
    }

    function setOwnUI(on) {
      isOwn = !!on;
      $("btn-edit-about").classList.toggle("hidden", !on);
      $("tab-edit-btn").classList.toggle("hidden", !on);
      $("btn-edit-banner").classList.toggle("hidden", !on);
    }

    // Supabase only returns columns that really exist. stamp_url is deliberately
    // not queried: it is not part of this profiles table.
    async function fetchProfile(queryBuilder) {
      let q = await queryBuilder(PROFILE_COLS);
      if (q.error && /banner_url|background_url|column/i.test(q.error.message || "")) {
        hasBannerCol = false;
        q = await queryBuilder(PROFILE_BASE_COLS);
      }
      if (q.error) throw q.error;
      return q.data;
    }

    async function fetchById(id) {
      return fetchProfile(cols =>
        sb.from("profiles").select(cols).eq("id", id).maybeSingle()
      );
    }

    async function fetchByUsername(username) {
      // case-insensitive match
      return fetchProfile(cols =>
        sb.from("profiles").select(cols).ilike("username", username).maybeSingle()
      );
    }

    async function loadOwn() {
      if (!session) throw new Error("No session");
      setOwnUI(true);
      let data = await fetchById(session.user.id);
      if (!data) {
        const base = (session.user.user_metadata?.username
          || (session.user.email || "user").split("@")[0]
          || "user").replace(/[^A-Za-z0-9_]/g, "_").slice(0, 24);
        const { error } = await sb.from("profiles").upsert({
          id: session.user.id,
          username: base,
          display_name: base
        });
        if (error) throw error;
        data = { id: session.user.id, username: base, display_name: base, bio: "" };
      }
      if ($("username")) $("username").value = data.username || "";
      if ($("display-name")) $("display-name").value = data.display_name || "";
      if ($("bio")) $("bio").value = data.bio || "";
      if ($("bio-about")) $("bio-about").value = data.bio || "";
      paint(data);
      await loadProfileActivity(data.id);
      return data;
    }

    async function loadPublic(username) {
      const data = await fetchByUsername(username);
      if (!data) {
        setOwnUI(false);
        paint({ username, display_name: "NOT FOUND", bio: "This profile does not exist." });
        return null;
      }
      // if this public profile is me, enable edit
      if (session && data.id === session.user.id) {
        setOwnUI(true);
        if ($("username")) $("username").value = data.username || "";
        if ($("display-name")) $("display-name").value = data.display_name || "";
        if ($("bio")) $("bio").value = data.bio || "";
        if ($("bio-about")) $("bio-about").value = data.bio || "";
      } else {
        setOwnUI(false);
      }
      paint(data);
      await loadProfileActivity(data.id);
      return data;
    }

    // The forum is the source of truth: topics + replies + their JSON attachments.
    // GitHub Pages serves this page; Supabase stores and returns the live records.
    async function fetchAllRows(table, columns, userId) {
      const all = [];
      const pageSize = 500;
      for (let from = 0; ; from += pageSize) {
        const { data, error } = await sb.from(table)
          .select(columns)
          .eq("user_id", userId)
          .order("created_at", { ascending: false })
          .range(from, from + pageSize - 1);
        if (error) throw error;
        const rows = data || [];
        all.push(...rows);
        if (rows.length < pageSize) break;
      }
      return all;
    }

    function safeAttachmentList(value) {
      if (!Array.isArray(value)) return [];
      return value.filter(a => a && typeof a === "object" && typeof a.url === "string" && a.url.trim());
    }

    function escapeProfileHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[ch]));
    }

    function mediaKind(file) {
      const type = String(file.type || "").toLowerCase();
      const name = String(file.name || file.url || "").toLowerCase();
      if (type.startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp|avif|svg)(\?|$)/.test(name)) return "Images";
      if (type.startsWith("video/") || /\.(mp4|webm|mov|m4v|ogv|avi|mkv)(\?|$)/.test(name)) return "Videos";
      if (type.startsWith("audio/") || /\.(mp3|wav|ogg|flac|m4a|opus)(\?|$)/.test(name)) return "Audio";
      return "Files";
    }

    function renderProfileAttachment(a) {
      const url = escapeProfileHtml(a.url);
      const name = escapeProfileHtml(a.name || "file");
      const type = String(a.type || "").toLowerCase();
      if (type.startsWith("image/")) return '<a href="' + url + '" target="_blank" rel="noopener"><img src="' + url + '" alt="' + name + '" loading="lazy"></a>';
      if (type.startsWith("video/")) return '<video controls preload="metadata" src="' + url + '"></video>';
      if (type.startsWith("audio/")) return '<audio controls preload="metadata" src="' + url + '"></audio>';
      return '<a href="' + url + '" target="_blank" rel="noopener">📎 ' + name + '</a>';
    }

    function renderProfileEntry(item) {
      const date = item.created_at ? new Date(item.created_at).toLocaleString() : "Date unavailable";
      const attachments = safeAttachmentList(item.attachments);
      const title = item.kind === "Topic" ? (item.title || "Untitled topic") : "Reply in thread #" + item.thread_id;
      const targetThread = item.kind === "Topic" ? item.id : item.thread_id;
      const threadUrl = "forum.html?thread=" + encodeURIComponent(String(targetThread || ""));
      const body = escapeProfileHtml(item.body || "");
      return '<article class="profile-entry">' +
        '<div class="profile-entry-title"><a href="' + threadUrl + '">' + escapeProfileHtml(title) + '</a></div>' +
        '<div class="profile-entry-meta">' + item.kind + ' · ' + escapeProfileHtml(date) + '</div>' +
        '<div class="profile-entry-body">' + body + '</div>' +
        (attachments.length ? '<div class="profile-entry-media">' + attachments.map(renderProfileAttachment).join("") + '</div>' : '') +
        '<div class="profile-entry-actions"><a href="' + threadUrl + '">View in forum →</a></div>' +
        '</article>';
    }

    async function loadProfileActivity(userId) {
      const postsBox = $("tab-posts");
      const mediaBox = $("tab-media");
      const activityBox = $("tab-activity");
      postsBox.innerHTML = '<p>Loading all postings…</p>';
      mediaBox.innerHTML = '<p>Loading media…</p>';
      activityBox.innerHTML = '<p>Loading activity…</p>';
      // A failed query must not silently turn into a fake zero.
      try {
        const [threads, replies] = await Promise.all([
          fetchAllRows("forum_threads", "id, title, body, attachments, created_at, board_id", userId),
          fetchAllRows("forum_posts", "id, thread_id, body, attachments, created_at", userId)
        ]);
        const entries = [
          ...threads.map(row => ({ ...row, kind: "Topic" })),
          ...replies.map(row => ({ ...row, kind: "Reply" }))
        ].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
        const media = entries.flatMap(entry => safeAttachmentList(entry.attachments).map(file => ({ ...file, parent: entry })));
        const counts = media.reduce((acc, file) => {
          const kind = mediaKind(file);
          acc[kind] = (acc[kind] || 0) + 1;
          return acc;
        }, {});

        $("stat-messages").textContent = String(entries.length);
        $("stat-media").textContent = String(media.length);
        postsBox.innerHTML = entries.length
          ? entries.map(renderProfileEntry).join("")
          : '<p class="profile-empty">This user has not posted yet.</p>';
        activityBox.innerHTML = entries.length
          ? '<p class="profile-summary">' + entries.length + ' messages · ' + media.length + ' media files</p>' + entries.slice(0, 10).map(renderProfileEntry).join("")
          : '<p class="profile-empty">No activity yet.</p>';

        const mediaSummary = '<div class="profile-media-counts">' +
          '<span>Images: <b>' + (counts.Images || 0) + '</b></span>' +
          '<span>Videos: <b>' + (counts.Videos || 0) + '</b></span>' +
          '<span>Audio: <b>' + (counts.Audio || 0) + '</b></span>' +
          '<span>Files: <b>' + (counts.Files || 0) + '</b></span>' +
          '</div>';
        mediaBox.innerHTML = media.length
          ? mediaSummary + media.map(file => {
              const parent = file.parent;
              const date = parent.created_at ? new Date(parent.created_at).toLocaleString() : "";
              const threadId = parent.kind === "Topic" ? parent.id : parent.thread_id;
              const threadUrl = "forum.html?thread=" + encodeURIComponent(String(threadId || ""));
              return '<article class="profile-entry"><div class="profile-entry-title">' + escapeProfileHtml(file.name || "Media") + '</div>' +
                '<div class="profile-entry-meta">' + parent.kind + ' · ' + escapeProfileHtml(date) + '</div>' +
                '<div class="profile-entry-media">' + renderProfileAttachment(file) + '</div>' +
                '<div class="profile-entry-actions"><a href="' + threadUrl + '">Open original post →</a></div></article>';
            }).join("")
          : mediaSummary + '<p class="profile-empty">This user has not uploaded media yet.</p>';
      } catch (err) {
        console.error("Profile activity load failed", err);
        const message = escapeProfileHtml(err.message || err);
        const errorHtml = '<p class="profile-error">Could not load data from Supabase: ' + message + '</p>';
        postsBox.innerHTML = errorHtml;
        mediaBox.innerHTML = errorHtml;
        activityBox.innerHTML = errorHtml;
        $("stat-messages").textContent = "—";
        $("stat-media").textContent = "—";
      }
    }

    async function uploadImage(file, basename) {
      if (!file) return null;
      if (file.size > 2.5 * 1024 * 1024) throw new Error("Image too large (max ~2 MB)");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = session.user.id + "/" + basename + "." + ext;
      const { error } = await sb.storage.from(AVATAR_BUCKET).upload(path, file, {
        upsert: true, contentType: file.type || "image/jpeg", cacheControl: "3600"
      });
      if (error) throw error;
      const { data } = sb.storage.from(AVATAR_BUCKET).getPublicUrl(path);
      return data.publicUrl + "?t=" + Date.now();
    }

    $("avatar-file").addEventListener("change", () => {
      const f = $("avatar-file").files?.[0];
      if (f) $("pf-avatar").src = URL.createObjectURL(f);
    });
    $("banner-file").addEventListener("change", () => {
      const f = $("banner-file").files?.[0];
      if (!f) return;
      $("pf-banner").style.backgroundImage = "url('" + URL.createObjectURL(f) + "')";
      $("pf-banner").classList.add("has-wp");
    });

    $("btn-edit-about").addEventListener("click", () => {
      $("tab-about").classList.add("about-mode-edit");
      const t = $("about-text").textContent;
      $("bio-about").value = (t === "No bio yet.") ? "" : t;
    });
    $("btn-cancel-about").addEventListener("click", () => {
      $("tab-about").classList.remove("about-mode-edit");
    });

    $("form-about").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session || !isOwn) return;
      const btn = $("btn-save-about");
      btn.disabled = true;
      setStatus("status-about", "Saving…");
      try {
        const bio = $("bio-about").value.trim();
        const payload = { id: session.user.id, bio: bio || null };
        const u = ($("username").value || "").trim();
        const d = ($("display-name").value || "").trim();
        if (u) payload.username = u;
        if (d) payload.display_name = d;
        const { error } = await sb.from("profiles").upsert(payload);
        if (error) throw error;
        $("about-text").textContent = bio || "No bio yet.";
        if ($("bio")) $("bio").value = bio;
        $("tab-about").classList.remove("about-mode-edit");
        setStatus("status-about", "Saved.", "ok");
      } catch (err) {
        setStatus("status-about", err.message || "Failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    $("form-profile").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session) return;
      const btn = $("btn-save");
      btn.disabled = true;
      setStatus("status", "Saving…");
      try {
        const username = $("username").value.trim();
        const display_name = $("display-name").value.trim();
        const bio = $("bio").value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) throw new Error("Username: 3–24 letters/numbers/_");
        let avatar_url, banner_url;
        const af = $("avatar-file").files?.[0];
        const bf = $("banner-file").files?.[0];
        if (af) { setStatus("status", "Uploading avatar…"); avatar_url = await uploadImage(af, "avatar"); }
        if (bf) { setStatus("status", "Uploading banner…"); banner_url = await uploadImage(bf, "banner"); }
        const payload = {
          id: session.user.id,
          username,
          display_name: display_name || username,
          bio: bio || null
        };
        if (avatar_url) payload.avatar_url = avatar_url;
        if (banner_url) {
          payload.banner_url = banner_url;
          payload.background_url = banner_url;
        }
        let { error } = await sb.from("profiles").upsert(payload);
        if (error && /banner_url|background_url|column/i.test(error.message || "")) {
          delete payload.banner_url;
          delete payload.background_url;
          ({ error } = await sb.from("profiles").upsert(payload));
        }
        if (error) throw error;
        setStatus("status", "Profile saved.", "ok");
        $("avatar-file").value = "";
        $("banner-file").value = "";
        await loadOwn();
      } catch (err) {
        setStatus("status", err.message || "Save failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.querySelectorAll(".pf-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pf-tabs button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        const tab = btn.getAttribute("data-tab");
        ["about","activity","posts","media","awards","edit"].forEach(t => {
          const el = $("tab-" + t);
          if (el) el.classList.toggle("hidden", t !== tab);
        });
        if (tab !== "about") $("tab-about").classList.remove("about-mode-edit");
      });
    });

    $("btn-edit-banner").addEventListener("click", () => {
      $("tab-edit-btn").click();
      $("banner-file").click();
    });
    $("btn-report").addEventListener("click", () => alert("Report (placeholder)."));
    $("btn-dm").addEventListener("click", () => alert("DM soon."));
    $("btn-find").addEventListener("click", () => alert("Find menu."));

    async function boot() {
      const params = new URLSearchParams(location.search);
      const publicUser = (params.get("u") || params.get("user") || "").trim();

      $("about-text").textContent = "Loading profile…";

      const { data, error } = await sb.auth.getSession();
      if (error) console.warn("getSession", error);
      session = data?.session || null;

      try {
        if (session) {
          // Always prefer own profile when logged in and no ?u= or ?u=me
          if (!publicUser || publicUser.toLowerCase() === "me") {
            await loadOwn();
          } else {
            await loadPublic(publicUser);
          }
        } else if (publicUser) {
          await loadPublic(publicUser);
        } else {
          setOwnUI(false);
          paint({
            display_name: "USER",
            username: "guest",
            bio: "Not logged in.\\nOpen login.html, then come back.\\nOr view someone: profile.html?u=Clawver"
          });
        }
      } catch (e) {
        console.error(e);
        $("about-text").textContent = "Error: " + (e.message || e);
      }
    }

    sb.auth.onAuthStateChange(async (event, sess) => {
      session = sess;
      if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
        const params = new URLSearchParams(location.search);
        const publicUser = (params.get("u") || "").trim();
        if (!publicUser || publicUser.toLowerCase() === "me") {
          try { await loadOwn(); } catch (e) { console.warn(e); }
        }
      }
      if (event === "SIGNED_OUT") {
        setOwnUI(false);
        paint({ display_name: "USER", username: "guest", bio: "Signed out. Login to edit your profile." });
      }
    });

    boot();
  </script>
  <script src="esmaiwol-chrome.js" defer></script>
</body>
