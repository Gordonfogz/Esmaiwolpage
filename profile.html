<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050509">
  <title>PROFILE // ESMAIWOL.ZN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050509;
      --blue: #1768ff;
      --green: #00ff83;
      --text: #cbd5ff;
      --muted: #91b7bb;
      --border: #164cff;
      --red: #ff6d86;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      font-size: 15px;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse at 20% 0%, #0a1840 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #061030 0%, transparent 45%);
    }
    a { color: var(--blue); }
    a:hover { color: var(--green); background: #10172c; }
    .wrap { width: min(560px, calc(100% - 28px)); margin: 32px auto 48px; }
    .nav { margin-bottom: 14px; font-size: 13px; font-weight: bold; }
    .panel {
      border: 2px solid var(--border);
      background: #05060c;
      box-shadow: 0 0 0 1px #080d36, 0 0 18px #00134c55;
      padding: 22px 20px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    h1 {
      margin: 0 0 16px;
      color: var(--green);
      font-size: 24px;
      letter-spacing: 1px;
    }
    .avatar-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 8px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border: 2px solid var(--border);
      background: #03040a;
      object-fit: cover;
      display: block;
    }
    .avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 28px;
    }
    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #293a79;
      background: #03040a;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--green); }
    textarea { min-height: 100px; resize: vertical; }
    input[type="file"] { padding: 8px; font-size: 12px; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      border: 1px solid var(--blue);
      background: #0a1025;
      color: var(--green);
      font: inherit;
      padding: 10px 14px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover { background: #172348; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .status { min-height: 20px; margin-top: 12px; font-size: 12px; color: var(--muted); }
    .status.error { color: var(--red); }
    .status.ok { color: var(--green); }
    .gate {
      text-align: center;
      padding: 28px 12px;
      border: 1px dashed #293a79;
      color: var(--muted);
    }
    .hidden { display: none !important; }
    .hint { margin-top: 14px; font-size: 12px; color: var(--muted); border-top: 1px dashed #1c2b61; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="index.html">← INDEX</a>
      &nbsp;//&nbsp;
      <a href="forum.html">FORUM</a>
      &nbsp;//&nbsp;
      <a href="login.html">LOGIN</a>
    </div>

    <div class="panel">
      <p class="eyebrow">ESMAIWOL.ZN // IDENTITY</p>
      <h1>USER PROFILE</h1>

      <div id="gate" class="gate">
        You must <a href="login.html">login</a> to edit your profile.
      </div>

      <form id="form-profile" class="hidden">
        <div class="avatar-row">
          <img id="avatar-preview" class="avatar hidden" alt="Avatar">
          <div id="avatar-placeholder" class="avatar placeholder">?</div>
          <div>
            <label for="avatar-file" style="margin-top:0">Avatar image</label>
            <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
            <p class="hint" style="margin:6px 0 0;border:0;padding:0">JPG/PNG/WebP/GIF · max ~2 MB</p>
          </div>
        </div>

        <label for="username">Username</label>
        <input id="username" maxlength="24" pattern="[A-Za-z0-9_]+" title="Letters, numbers, underscore" required>

        <label for="display-name">Display name</label>
        <input id="display-name" maxlength="48">

        <label for="bio">Bio</label>
        <textarea id="bio" maxlength="500" placeholder="A few lines about you…"></textarea>

        <button class="btn" type="submit" id="btn-save">[ SAVE PROFILE ]</button>
        <div class="status" id="status" role="status"></div>

        <p class="hint">
          Profiles are for the login forums only.<br>
          The imageboard (chan) stays anonymous.
        </p>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const AVATAR_BUCKET = "avatars";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    let session = null;

    function setStatus(msg, type) {
      const el = $("status");
      el.textContent = msg || "";
      el.className = "status" + (type ? " " + type : "");
    }

    function showAvatar(url) {
      const img = $("avatar-preview");
      const ph = $("avatar-placeholder");
      if (url) {
        img.src = url;
        img.classList.remove("hidden");
        ph.classList.add("hidden");
      } else {
        img.removeAttribute("src");
        img.classList.add("hidden");
        ph.classList.remove("hidden");
      }
    }

    async function loadProfile() {
      const { data, error } = await sb.from("profiles")
        .select("username, display_name, bio, avatar_url")
        .eq("id", session.user.id)
        .maybeSingle();
      if (error) throw error;

      if (!data) {
        // Create empty profile row
        const baseUser = (session.user.user_metadata?.username || session.user.email || "user").split("@")[0]
          .replace(/[^A-Za-z0-9_]/g, "_").slice(0, 24) || "user";
        const { error: insErr } = await sb.from("profiles").upsert({
          id: session.user.id,
          username: baseUser,
          display_name: baseUser
        });
        if (insErr) throw insErr;
        $("username").value = baseUser;
        $("display-name").value = baseUser;
        $("bio").value = "";
        showAvatar(null);
        return;
      }

      $("username").value = data.username || "";
      $("display-name").value = data.display_name || "";
      $("bio").value = data.bio || "";
      showAvatar(data.avatar_url || null);
    }

    async function uploadAvatar(file) {
      if (!file) return null;
      if (file.size > 2.5 * 1024 * 1024) throw new Error("Image too large (max ~2 MB)");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = session.user.id + "/avatar." + ext;
      const { error } = await sb.storage.from(AVATAR_BUCKET).upload(path, file, {
        upsert: true,
        contentType: file.type || "image/jpeg",
        cacheControl: "3600"
      });
      if (error) throw error;
      const { data } = sb.storage.from(AVATAR_BUCKET).getPublicUrl(path);
      // cache-bust
      return data.publicUrl + "?t=" + Date.now();
    }

    $("avatar-file").addEventListener("change", () => {
      const file = $("avatar-file").files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      showAvatar(url);
    });

    $("form-profile").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session) return;
      const btn = $("btn-save");
      btn.disabled = true;
      setStatus("Saving…");
      try {
        const username = $("username").value.trim();
        const display_name = $("display-name").value.trim();
        const bio = $("bio").value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {
          throw new Error("Username: 3–24 chars, letters/numbers/_ only");
        }

        let avatar_url = undefined;
        const file = $("avatar-file").files?.[0];
        if (file) {
          setStatus("Uploading avatar…");
          avatar_url = await uploadAvatar(file);
        }

        const payload = {
          id: session.user.id,
          username,
          display_name: display_name || username,
          bio: bio || null
        };
        if (avatar_url) payload.avatar_url = avatar_url;

        const { error } = await sb.from("profiles").upsert(payload);
        if (error) throw error;

        if (avatar_url) showAvatar(avatar_url);
        $("avatar-file").value = "";
        setStatus("Profile saved.", "ok");
      } catch (err) {
        setStatus(err.message || "Save failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    (async () => {
      const { data } = await sb.auth.getSession();
      session = data.session;
      if (!session) {
        $("gate").classList.remove("hidden");
        $("form-profile").classList.add("hidden");
        return;
      }
      $("gate").classList.add("hidden");
      $("form-profile").classList.remove("hidden");
      try {
        await loadProfile();
      } catch (err) {
        setStatus(err.message || "Could not load profile", "error");
      }
    })();
  </script>
</body>
</html>
