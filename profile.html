<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a9ec8">
  <title>PROFILE // ESMAIWOL.ZN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue-banner: #6b9fd4;
      --panel-gray: #c8c8c8;
      --panel-light: #dcdcdc;
      --ink: #222;
      --bezel: #1a1a1c;
      --bezel-hi: #3a3a3e;
      --silver: #c5c9ce;
      --silver-dk: #8e949c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #c8e4f8, transparent 60%),
        linear-gradient(180deg, #8ec4e8 0%, #5a9acc 50%, #3a7aaa 100%);
    }
    a { color: #1a5a9a; }
    .page { width: min(920px, calc(100% - 12px)); margin: 12px auto 40px; }
    .nav { margin-bottom: 12px; font-size: 13px; font-weight: 600; }
    .nav a { margin-right: 12px; text-decoration: none; color: #0a3a60; }

    /* ===== CSS Xperia Play shell ===== */
    .xperia {
      width: min(780px, 100%);
      margin: 0 auto;
      filter: drop-shadow(0 16px 28px rgba(0,15,35,0.4));
    }
    /* Top handset body */
    .xperia-body {
      background: linear-gradient(180deg, #2a2a2e 0%, #141416 55%, #0e0e10 100%);
      border-radius: 28px 28px 18px 18px;
      border: 2px solid #0a0a0c;
      padding: 14px 16px 12px;
      position: relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        inset 0 -2px 6px rgba(0,0,0,0.5);
    }
    .xperia-body::before {
      content: "Sony Ericsson";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      transform-origin: center center;
      font: 600 9px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      color: #666;
      white-space: nowrap;
      pointer-events: none;
    }
    .xperia-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 8px;
      color: #888;
      font: 600 10px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
    }
    .xperia-topbar .brand { color: #aaa; font-size: 11px; }
    .xperia-topbar .clock { color: #777; }

    /* Exact screen — everything lives here */
    .phone-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      background: #c8c8c8;
      border: 2px solid #050506;
      box-shadow:
        inset 0 0 0 1px #333,
        0 0 0 1px #111;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    /* Speaker grille + sensors */
    .xperia-chin {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding-top: 8px;
      height: 22px;
    }
    .xperia-chin .spk {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, #222 0 2px, #444 2px 3px);
    }
    .xperia-chin .led {
      width: 6px; height: 6px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a4, #060);
    }

    /* Gamepad dock */
    .xperia-pad {
      margin-top: -2px;
      background: linear-gradient(180deg, #d0d4d8 0%, #a8 greyscale);
      background: linear-gradient(180deg, #d2d6da 0%, #9ea4ac 45%, #7a8088 100%);
      border-radius: 0 0 26px 26px;
      border: 2px solid #6a7078;
      border-top: 0;
      padding: 14px 18px 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.45);
    }
    .pad-left, .pad-right { display: flex; justify-content: center; }
    .dpad {
      width: 88px; height: 88px;
      position: relative;
    }
    .dpad span {
      position: absolute;
      background: linear-gradient(180deg, #e8ecef, #9aa1a8);
      border: 1px solid #6a7078;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.25);
    }
    .dpad .n { left: 28px; top: 4px; width: 32px; height: 36px; border-radius: 5px 5px 2px 2px; }
    .dpad .s { left: 28px; bottom: 4px; width: 32px; height: 36px; border-radius: 2px 2px 5px 5px; }
    .dpad .w { left: 4px; top: 28px; width: 36px; height: 32px; border-radius: 5px 2px 2px 5px; }
    .dpad .e { right: 4px; top: 28px; width: 36px; height: 32px; border-radius: 2px 5px 5px 2px; }
    .dpad .c {
      left: 30px; top: 30px; width: 28px; height: 28px; border-radius: 4px;
      background: linear-gradient(180deg, #c8ccd0, #888e96);
    }
    .pad-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .pad-mid .selects {
      display: flex; gap: 14px;
    }
    .pad-mid .sel {
      width: 28px; height: 10px; border-radius: 3px;
      background: linear-gradient(180deg, #bbb, #777);
      border: 1px solid #555;
    }
    .pad-mid .logo {
      font: 700 9px/1 "Segoe UI", sans-serif;
      color: #5a6068;
      letter-spacing: 0.08em;
    }
    .buttons {
      width: 88px; height: 88px;
      position: relative;
    }
    .buttons i {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #e8ecef, #9aa1a8);
      border: 1px solid #6a7078;
      box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.25);
      font: 700 11px/28px "Segoe UI", sans-serif;
      text-align: center;
      color: #444;
    }
    .buttons .t { left: 30px; top: 2px; }
    .buttons .x { left: 2px; top: 30px; }
    .buttons .o { right: 2px; top: 30px; }
    .buttons .s { left: 30px; bottom: 2px; }

    /* ===== Profile UI inside screen ===== */
    .pf-banner {
      position: relative;
      flex: 0 0 40%;
      min-height: 96px;
      background-color: var(--blue-banner);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px 8px;
      gap: 12px;
    }
    .pf-banner.has-wp { background-color: #333; }
    .pf-actions {
      position: absolute;
      top: 8px; right: 8px;
      display: flex; gap: 4px; z-index: 2;
    }
    .pf-actions button {
      font: 600 10px/1 "Segoe UI", sans-serif;
      padding: 4px 8px;
      border: 1px solid #999;
      background: linear-gradient(180deg, #f4f4f4, #d0d0d0);
      color: #222;
      cursor: pointer;
      border-radius: 2px;
    }
    .pf-avatar {
      width: 68px; height: 68px;
      flex-shrink: 0;
      border: 2px solid #fff;
      background: #e8eef4;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .pf-nameblock { min-width: 0; padding-bottom: 2px; }
    .pf-name {
      margin: 0;
      font-size: clamp(15px, 2.2vw, 22px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pf-handle {
      margin: 2px 0 0;
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    .pf-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--panel-gray);
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
      flex-shrink: 0;
    }
    .pf-stats > div {
      text-align: center;
      padding: 6px 2px 5px;
      border-right: 1px solid #b0b0b0;
    }
    .pf-stats > div:last-child { border-right: 0; }
    .pf-stats b { display: block; font-size: 14px; color: #1a1a1a; line-height: 1.2; }
    .pf-stats span { font-size: 9px; color: #444; }

    .pf-btns {
      display: flex; gap: 6px;
      padding: 7px 10px;
      background: var(--panel-light);
      border-bottom: 1px solid #bbb;
      flex-shrink: 0;
    }
    .pf-btns button {
      font: 600 11px/1 "Segoe UI", sans-serif;
      padding: 5px 12px;
      border: 1px solid #888;
      background: linear-gradient(180deg, #f6f6f6, #d4d4d4);
      border-radius: 2px;
      cursor: pointer;
      color: #222;
    }

    .pf-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      background: #c0c0c0;
      border-bottom: 1px solid #999;
      flex-shrink: 0;
    }
    .pf-tabs button {
      border: 0;
      border-right: 1px solid #aaa;
      background: #d8d8d8;
      padding: 6px 10px;
      font: 600 10px/1 "Segoe UI", sans-serif;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
    }
    .pf-tabs button.on { background: #ececec; color: #111; }

    .pf-body {
      flex: 1;
      background: #ececec;
      padding: 10px 12px;
      overflow: auto;
      font-size: 12px;
      color: #222;
      min-height: 0;
    }
    .pf-body p { margin: 0 0 8px; white-space: pre-wrap; }

    .about-view { display: block; }
    .about-edit { display: none; }
    .about-mode-edit .about-view { display: none; }
    .about-mode-edit .about-edit { display: block; }

    .edit-form label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #444;
      margin: 8px 0 3px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .edit-form input, .edit-form textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #999;
      border-radius: 2px;
      font: 12px "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }
    .edit-form textarea { min-height: 56px; resize: vertical; }
    .edit-form .row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px;
    }
    .btn-save, .btn-edit-about {
      border: 1px solid #2a6a9a;
      background: linear-gradient(180deg, #6ab0e0, #3a80b0);
      color: #fff;
      font: 700 12px "Segoe UI", sans-serif;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-edit-about {
      border-color: #666;
      background: linear-gradient(180deg, #f0f0f0, #c8c8c8);
      color: #222;
      margin-top: 6px;
    }
    .btn-save:disabled { opacity: 0.6; cursor: wait; }
    .status { font-size: 11px; }
    .status.ok { color: #0a7040; }
    .status.error { color: #a02030; }
    .hidden { display: none !important; }
    .hint { font-size: 10px; color: #555; margin-top: 6px; }
    .hint code { background: #ddd; padding: 1px 4px; border-radius: 2px; }

    @media (max-width: 560px) {
      .xperia-body { padding: 10px 10px 8px; border-radius: 20px 20px 14px 14px; }
      .xperia-body::before { display: none; }
      .pf-avatar { width: 52px; height: 52px; }
      .dpad, .buttons { width: 70px; height: 70px; transform: scale(0.9); }
      .pf-stats span { font-size: 8px; }
      .pf-stats b { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <a href="index.html">← Index</a>
      <a href="forum.html">Forum</a>
      <a href="chat.html">Chat</a>
      <a href="login.html">Login</a>
    </div>

    <div class="xperia">
      <div class="xperia-body">
        <div class="xperia-topbar">
          <span class="brand">XPERIA PLAY</span>
          <span class="clock" id="xperia-clock">12:00</span>
        </div>
        <div class="phone-screen" id="phone-screen">
          <div class="pf-banner" id="pf-banner">
            <div class="pf-actions">
              <button type="button" id="btn-report">Report</button>
              <button type="button" id="btn-edit-banner" class="hidden">Edit profile banner</button>
            </div>
            <img class="pf-avatar" id="pf-avatar" src="default-avatar.jpeg" alt="Avatar">
            <div class="pf-nameblock">
              <p class="pf-name" id="pf-name">USER</p>
              <p class="pf-handle" id="pf-handle">@user</p>
            </div>
          </div>

          <div class="pf-stats">
            <div><b id="stat-messages">0</b><span>Messages</span></div>
            <div><b id="stat-media">0</b><span>Media</span></div>
            <div><b id="stat-react">0</b><span>Reaction score</span></div>
            <div><b id="stat-tags">0</b><span>Agora GangTags</span></div>
            <div><b id="stat-awards">0</b><span>Awards</span></div>
          </div>

          <div class="pf-btns">
            <button type="button" id="btn-dm">Send direct message</button>
            <button type="button" id="btn-find">Find ▾</button>
          </div>

          <div class="pf-tabs">
            <button type="button" data-tab="activity">Latest activity</button>
            <button type="button" data-tab="posts">Postings</button>
            <button type="button" data-tab="media">Media</button>
            <button type="button" data-tab="awards">Awards</button>
            <button type="button" class="on" data-tab="about">About</button>
            <button type="button" data-tab="edit" id="tab-edit-btn" class="hidden">Edit</button>
          </div>

          <div class="pf-body" id="tab-about">
            <div class="about-view">
              <p id="about-text">No bio yet.</p>
              <button type="button" class="btn-edit-about hidden" id="btn-edit-about">Edit About me</button>
              <p class="hint">Public: <code id="share-url">profile.html?u=username</code></p>
            </div>
            <div class="about-edit">
              <form class="edit-form" id="form-about">
                <label for="bio-about">About me</label>
                <textarea id="bio-about" maxlength="500" placeholder="Write your About me…"></textarea>
                <div class="row">
                  <button type="submit" class="btn-save" id="btn-save-about">Save About</button>
                  <button type="button" class="btn-edit-about" id="btn-cancel-about">Cancel</button>
                  <span class="status" id="status-about"></span>
                </div>
              </form>
            </div>
          </div>
          <div class="pf-body hidden" id="tab-activity"><p>No recent activity.</p></div>
          <div class="pf-body hidden" id="tab-posts"><p>No postings listed yet.</p></div>
          <div class="pf-body hidden" id="tab-media"><p>No media yet.</p></div>
          <div class="pf-body hidden" id="tab-awards"><p>No awards yet.</p></div>
          <div class="pf-body hidden" id="tab-edit">
            <form class="edit-form" id="form-profile">
              <label for="avatar-file">Profile picture (PFP)</label>
              <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
              <label for="banner-file">Banner / wallpaper</label>
              <input id="banner-file" type="file" accept="image/jpeg,image/png,image/webp">
              <label for="username">Username</label>
              <input id="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required>
              <label for="display-name">Display name</label>
              <input id="display-name" maxlength="48">
              <label for="bio">Bio (About)</label>
              <textarea id="bio" maxlength="500" placeholder="A few lines about you…"></textarea>
              <div class="row">
                <button type="submit" class="btn-save" id="btn-save">Save profile</button>
                <span class="status" id="status"></span>
              </div>
              <p class="hint">Saved in Supabase. Others: <code>profile.html?u=yourname</code></p>
            </form>
          </div>
        </div>
        <div class="xperia-chin">
          <div class="spk"></div>
          <div class="led"></div>
          <div class="spk"></div>
        </div>
      </div>
      <div class="xperia-pad">
        <div class="pad-left">
          <div class="dpad" aria-hidden="true">
            <span class="n"></span><span class="s"></span><span class="w"></span><span class="e"></span><span class="c"></span>
          </div>
        </div>
        <div class="pad-mid">
          <div class="selects"><div class="sel"></div><div class="sel"></div></div>
          <div class="logo">PLAY</div>
        </div>
        <div class="pad-right">
          <div class="buttons" aria-hidden="true">
            <i class="t">△</i><i class="x">□</i><i class="o">○</i><i class="s">×</i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const AVATAR_BUCKET = "avatars";
    const DEFAULT_AVATAR = "default-avatar.jpeg";
    const PROFILE_COLS = "username, display_name, bio, avatar_url, stamp_url, created_at";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    let session = null;
    let isOwn = false;
    let hasBannerCol = null;

    function tickClock() {
      const el = $("xperia-clock");
      if (el) el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    tickClock();
    setInterval(tickClock, 15000);

    function setStatus(id, msg, type) {
      const el = $(id);
      if (!el) return;
      el.textContent = msg || "";
      el.className = "status" + (type ? " " + type : "");
    }

    function paint(p) {
      p = p || {};
      const nick = p.display_name || p.username || "USER";
      $("pf-name").textContent = nick;
      $("pf-handle").textContent = p.username ? "@" + p.username : "@user";
      $("about-text").textContent = p.bio || "No bio yet.";
      $("bio-about").value = p.bio || "";
      $("share-url").textContent = "profile.html?u=" + (p.username || "username");
      const av = $("pf-avatar");
      av.src = p.avatar_url || DEFAULT_AVATAR;
      av.onerror = () => { av.src = DEFAULT_AVATAR; };
      const ban = $("pf-banner");
      if (p.banner_url) {
        ban.style.backgroundImage = "url('" + String(p.banner_url).replace(/'/g, "%27") + "')";
        ban.classList.add("has-wp");
      } else {
        ban.style.backgroundImage = "none";
        ban.classList.remove("has-wp");
      }
      $("stat-messages").textContent = p.messages_count != null ? p.messages_count : "0";
      $("stat-media").textContent = p.media_count != null ? p.media_count : "0";
      $("stat-react").textContent = p.reaction_score != null ? p.reaction_score : "0";
      $("stat-tags").textContent = p.gang_tags != null ? p.gang_tags : "0";
      $("stat-awards").textContent = p.awards_count != null ? p.awards_count : "0";
    }

    async function fetchProfileById(id) {
      let q = await sb.from("profiles").select(PROFILE_COLS + ", banner_url").eq("id", id).maybeSingle();
      if (q.error && /banner_url|column/i.test(q.error.message || "")) {
        hasBannerCol = false;
        q = await sb.from("profiles").select(PROFILE_COLS).eq("id", id).maybeSingle();
      } else if (!q.error) hasBannerCol = true;
      if (q.error) throw q.error;
      return q.data;
    }
    async function fetchProfileByUser(username) {
      let q = await sb.from("profiles").select(PROFILE_COLS + ", banner_url").eq("username", username).maybeSingle();
      if (q.error && /banner_url|column/i.test(q.error.message || "")) {
        hasBannerCol = false;
        q = await sb.from("profiles").select(PROFILE_COLS).eq("username", username).maybeSingle();
      } else if (!q.error) hasBannerCol = true;
      if (q.error) throw q.error;
      return q.data;
    }

    async function loadOwn() {
      isOwn = true;
      $("btn-edit-about").classList.remove("hidden");
      $("tab-edit-btn").classList.remove("hidden");
      $("btn-edit-banner").classList.remove("hidden");
      let data = await fetchProfileById(session.user.id);
      if (!data) {
        const base = (session.user.user_metadata?.username || session.user.email || "user")
          .split("@")[0].replace(/[^A-Za-z0-9_]/g, "_").slice(0, 24) || "user";
        await sb.from("profiles").upsert({ id: session.user.id, username: base, display_name: base });
        data = { username: base, display_name: base, bio: "" };
      }
      $("username").value = data.username || "";
      $("display-name").value = data.display_name || "";
      $("bio").value = data.bio || "";
      $("bio-about").value = data.bio || "";
      paint(data);
    }

    async function loadPublic(username) {
      isOwn = false;
      $("btn-edit-about").classList.add("hidden");
      const data = await fetchProfileByUser(username);
      if (!data) {
        paint({ username, display_name: "NOT FOUND", bio: "This profile does not exist." });
        return;
      }
      paint(data);
      if (session) {
        const me = await fetchProfileById(session.user.id);
        if (me && me.username && me.username.toLowerCase() === username.toLowerCase()) await loadOwn();
      }
    }

    async function uploadImage(file, basename) {
      if (!file) return null;
      if (file.size > 2.5 * 1024 * 1024) throw new Error("Image too large (max ~2 MB)");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = session.user.id + "/" + basename + "." + ext;
      const { error } = await sb.storage.from(AVATAR_BUCKET).upload(path, file, {
        upsert: true, contentType: file.type || "image/jpeg", cacheControl: "3600"
      });
      if (error) throw error;
      const { data } = sb.storage.from(AVATAR_BUCKET).getPublicUrl(path);
      return data.publicUrl + "?t=" + Date.now();
    }

    $("avatar-file").addEventListener("change", () => {
      const f = $("avatar-file").files?.[0];
      if (f) $("pf-avatar").src = URL.createObjectURL(f);
    });
    $("banner-file").addEventListener("change", () => {
      const f = $("banner-file").files?.[0];
      if (!f) return;
      $("pf-banner").style.backgroundImage = "url('" + URL.createObjectURL(f) + "')";
      $("pf-banner").classList.add("has-wp");
    });

    $("btn-edit-about").addEventListener("click", () => {
      $("tab-about").classList.add("about-mode-edit");
      $("bio-about").value = $("about-text").textContent === "No bio yet." ? "" : $("about-text").textContent;
    });
    $("btn-cancel-about").addEventListener("click", () => {
      $("tab-about").classList.remove("about-mode-edit");
    });

    $("form-about").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session || !isOwn) return;
      const btn = $("btn-save-about");
      btn.disabled = true;
      setStatus("status-about", "Saving…");
      try {
        const bio = $("bio-about").value.trim();
        const payload = { id: session.user.id, bio: bio || null };
        const u = $("username").value.trim();
        const d = $("display-name").value.trim();
        if (u) payload.username = u;
        if (d) payload.display_name = d;
        const { error } = await sb.from("profiles").upsert(payload);
        if (error) throw error;
        $("about-text").textContent = bio || "No bio yet.";
        $("bio").value = bio;
        $("tab-about").classList.remove("about-mode-edit");
        setStatus("status-about", "Saved.", "ok");
      } catch (err) {
        setStatus("status-about", err.message || "Failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    $("form-profile").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session) return;
      const btn = $("btn-save");
      btn.disabled = true;
      setStatus("status", "Saving…");
      try {
        const username = $("username").value.trim();
        const display_name = $("display-name").value.trim();
        const bio = $("bio").value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) throw new Error("Username: 3–24 letters/numbers/_");
        let avatar_url, banner_url;
        const af = $("avatar-file").files?.[0];
        const bf = $("banner-file").files?.[0];
        if (af) { setStatus("status", "Uploading avatar…"); avatar_url = await uploadImage(af, "avatar"); }
        if (bf) { setStatus("status", "Uploading banner…"); banner_url = await uploadImage(bf, "banner"); }
        const payload = {
          id: session.user.id,
          username,
          display_name: display_name || username,
          bio: bio || null
        };
        if (avatar_url) payload.avatar_url = avatar_url;
        if (banner_url && hasBannerCol !== false) payload.banner_url = banner_url;
        let { error } = await sb.from("profiles").upsert(payload);
        if (error && banner_url && /banner_url|column/i.test(error.message || "")) {
          hasBannerCol = false;
          delete payload.banner_url;
          ({ error } = await sb.from("profiles").upsert(payload));
          if (!error) setStatus("status", "Saved (add banner_url column for wallpapers)", "ok");
        }
        if (error) throw error;
        if (!$("status").textContent) setStatus("status", "Profile saved.", "ok");
        $("avatar-file").value = "";
        $("banner-file").value = "";
        await loadOwn();
      } catch (err) {
        setStatus("status", err.message || "Save failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.querySelectorAll(".pf-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pf-tabs button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        const tab = btn.getAttribute("data-tab");
        ["about","activity","posts","media","awards","edit"].forEach(t => {
          const el = $("tab-" + t);
          if (el) el.classList.toggle("hidden", t !== tab);
        });
        if (tab !== "about") $("tab-about").classList.remove("about-mode-edit");
      });
    });

    $("btn-edit-banner").addEventListener("click", () => {
      $("tab-edit-btn").click();
      $("banner-file").click();
    });
    $("btn-report").addEventListener("click", () => alert("Report (placeholder)."));
    $("btn-dm").addEventListener("click", () => alert("DM soon."));
    $("btn-find").addEventListener("click", () => alert("Find menu."));

    (async () => {
      const params = new URLSearchParams(location.search);
      const publicUser = (params.get("u") || params.get("user") || "").trim();
      const { data } = await sb.auth.getSession();
      session = data.session;
      try {
        if (publicUser) await loadPublic(publicUser);
        else if (session) await loadOwn();
        else paint({ display_name: "USER", username: "guest", bio: "Sign in to edit your profile.\nOr open profile.html?u=someone" });
      } catch (e) {
        $("about-text").textContent = e.message || "Failed to load";
      }
    })();
  </script>
  <script src="esmaiwol-chrome.js" defer></script>
</body>
</html>
