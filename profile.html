<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6a9ec8">
  <title>PROFILE // ESMAIWOL.ZN</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue-banner: #6b9fd4;
      --panel-gray: #c8c8c8;
      --panel-light: #dcdcdc;
      --ink: #222;
      --muted: #555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, #c8e4f8, transparent 60%),
        linear-gradient(180deg, #8ec4e8 0%, #5a9acc 50%, #3a7aaa 100%);
    }
    a { color: #1a5a9a; }
    .page {
      width: min(980px, calc(100% - 16px));
      margin: 16px auto 40px;
    }
    .nav {
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .nav a { margin-right: 12px; text-decoration: none; color: #0a3a60; }
    .nav a:hover { text-decoration: underline; }

    /* Phone shell — landscape Xperia Play */
    .phone-stage {
      position: relative;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      aspect-ratio: 16 / 10;
      filter: drop-shadow(0 14px 28px rgba(0,20,40,0.4));
    }
    .phone-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      z-index: 5;
    }
    /* Screen area inset inside the bezel (tuned to Xperia landscape PNG) */
    .phone-screen {
      position: absolute;
      z-index: 4;
      left: 7.5%;
      right: 7.5%;
      top: 8%;
      bottom: 22%;
      overflow: hidden;
      border-radius: 4px;
      background: #b0b0b0;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    /* Banner / wallpaper zone */
    .pf-banner {
      position: relative;
      flex: 0 0 42%;
      min-height: 110px;
      background-color: var(--blue-banner);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 10px 12px 8px;
      gap: 12px;
    }
    .pf-banner.has-wp {
      background-color: #333;
    }
    .pf-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }
    .pf-actions button {
      font: 600 10px/1 "Segoe UI", sans-serif;
      padding: 4px 8px;
      border: 1px solid #999;
      background: linear-gradient(180deg, #f4f4f4, #d0d0d0);
      color: #222;
      cursor: pointer;
      border-radius: 2px;
    }
    .pf-actions button:hover { filter: brightness(1.05); }

    .pf-avatar {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border: 2px solid #fff;
      background: #e8eef4;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .pf-nameblock {
      min-width: 0;
      padding-bottom: 4px;
    }
    .pf-name {
      margin: 0;
      font-size: clamp(16px, 2.4vw, 22px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.55);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pf-handle {
      margin: 2px 0 0;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Stats strip */
    .pf-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--panel-gray);
      border-top: 1px solid #aaa;
      border-bottom: 1px solid #aaa;
    }
    .pf-stats > div {
      text-align: center;
      padding: 6px 2px 5px;
      border-right: 1px solid #b0b0b0;
    }
    .pf-stats > div:last-child { border-right: 0; }
    .pf-stats b {
      display: block;
      font-size: 14px;
      color: #1a1a1a;
      line-height: 1.2;
    }
    .pf-stats span {
      font-size: 9px;
      color: #444;
      text-transform: none;
    }

    /* Action row */
    .pf-btns {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: var(--panel-light);
      border-bottom: 1px solid #bbb;
    }
    .pf-btns button {
      font: 600 11px/1 "Segoe UI", sans-serif;
      padding: 5px 12px;
      border: 1px solid #888;
      background: linear-gradient(180deg, #f6f6f6, #d4d4d4);
      border-radius: 2px;
      cursor: pointer;
      color: #222;
    }
    .pf-btns button:hover { filter: brightness(1.04); }

    /* Tabs */
    .pf-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      background: #c0c0c0;
      border-bottom: 1px solid #999;
    }
    .pf-tabs button {
      border: 0;
      border-right: 1px solid #aaa;
      background: #d8d8d8;
      padding: 6px 10px;
      font: 600 10px/1 "Segoe UI", sans-serif;
      color: #333;
      cursor: pointer;
    }
    .pf-tabs button.on {
      background: #ececec;
      color: #111;
    }
    .pf-tabs button:hover { background: #e4e4e4; }

    .pf-body {
      flex: 1;
      background: #ececec;
      padding: 10px 12px;
      overflow: auto;
      font-size: 12px;
      color: #222;
      min-height: 0;
    }
    .pf-body p { margin: 0 0 8px; white-space: pre-wrap; }

    /* Edit form inside About/Edit */
    .edit-form label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #444;
      margin: 8px 0 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .edit-form input, .edit-form textarea {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #999;
      border-radius: 2px;
      font: 12px "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
    }
    .edit-form textarea { min-height: 64px; resize: vertical; }
    .edit-form .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .btn-save {
      border: 1px solid #2a6a9a;
      background: linear-gradient(180deg, #6ab0e0, #3a80b0);
      color: #fff;
      font: 700 12px "Segoe UI", sans-serif;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-save:disabled { opacity: 0.6; cursor: wait; }
    .status { font-size: 11px; }
    .status.ok { color: #0a7040; }
    .status.error { color: #a02030; }
    .hidden { display: none !important; }
    .hint { font-size: 10px; color: #555; margin-top: 6px; }
    .hint code { background: #ddd; padding: 1px 4px; border-radius: 2px; }

    @media (max-width: 640px) {
      .phone-stage { aspect-ratio: 16 / 12; }
      .phone-screen { left: 6%; right: 6%; top: 7%; bottom: 20%; font-size: 11px; }
      .pf-avatar { width: 52px; height: 52px; }
      .pf-stats span { font-size: 8px; }
      .pf-stats b { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="nav">
      <a href="index.html">← Index</a>
      <a href="forum.html">Forum</a>
      <a href="chat.html">Chat</a>
      <a href="login.html">Login</a>
    </div>

    <div class="phone-stage" id="phone-stage">
      <div class="phone-screen" id="phone-screen">
        <div class="pf-banner" id="pf-banner">
          <div class="pf-actions">
            <button type="button" id="btn-report" title="Report">Report</button>
            <button type="button" id="btn-edit-banner" class="hidden">Edit profile banner</button>
          </div>
          <img class="pf-avatar" id="pf-avatar" src="default-avatar.jpeg" alt="Avatar">
          <div class="pf-nameblock">
            <p class="pf-name" id="pf-name">USER</p>
            <p class="pf-handle" id="pf-handle">@user</p>
          </div>
        </div>

        <div class="pf-stats">
          <div><b id="stat-messages">0</b><span>Messages</span></div>
          <div><b id="stat-media">0</b><span>Media</span></div>
          <div><b id="stat-react">0</b><span>Reaction score</span></div>
          <div><b id="stat-tags">0</b><span>Agora GangTags</span></div>
          <div><b id="stat-awards">0</b><span>Awards</span></div>
        </div>

        <div class="pf-btns">
          <button type="button" id="btn-dm">Send direct message</button>
          <button type="button" id="btn-find">Find ▾</button>
        </div>

        <div class="pf-tabs">
          <button type="button" data-tab="activity">Latest activity</button>
          <button type="button" data-tab="posts">Postings</button>
          <button type="button" data-tab="media">Media</button>
          <button type="button" data-tab="awards">Awards</button>
          <button type="button" class="on" data-tab="about">About</button>
          <button type="button" data-tab="edit" id="tab-edit-btn" class="hidden">Edit</button>
        </div>

        <div class="pf-body" id="tab-about">
          <p id="about-text">No bio yet.</p>
          <p class="hint">Public link: <code id="share-url">profile.html?u=username</code></p>
        </div>
        <div class="pf-body hidden" id="tab-activity"><p>No recent activity.</p></div>
        <div class="pf-body hidden" id="tab-posts"><p>No postings listed yet.</p></div>
        <div class="pf-body hidden" id="tab-media"><p>No media yet.</p></div>
        <div class="pf-body hidden" id="tab-awards"><p>No awards yet.</p></div>
        <div class="pf-body hidden" id="tab-edit">
          <form class="edit-form" id="form-profile">
            <label for="avatar-file">Profile picture (PFP)</label>
            <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">

            <label for="banner-file">Banner / wallpaper (optional)</label>
            <input id="banner-file" type="file" accept="image/jpeg,image/png,image/webp">

            <label for="username">Username</label>
            <input id="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required>

            <label for="display-name">Display name</label>
            <input id="display-name" maxlength="48">

            <label for="bio">Bio (About)</label>
            <textarea id="bio" maxlength="500" placeholder="A few lines about you…"></textarea>

            <div class="row">
              <button type="submit" class="btn-save" id="btn-save">Save profile</button>
              <span class="status" id="status"></span>
            </div>
            <p class="hint">Saved in Supabase. Others open <code>profile.html?u=yourname</code>.</p>
          </form>
        </div>
      </div>
      <img class="phone-frame" src="xperia-play-frame.png" alt="Sony Ericsson Xperia Play">
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const AVATAR_BUCKET = "avatars";
    const DEFAULT_AVATAR = "default-avatar.jpeg";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);
    let session = null;
    let currentProfile = null;

    function setStatus(msg, type) {
      const el = $("status");
      if (!el) return;
      el.textContent = msg || "";
      el.className = "status" + (type ? " " + type : "");
    }

    function paint(p) {
      currentProfile = p || {};
      const nick = p.display_name || p.username || "USER";
      $("pf-name").textContent = nick;
      $("pf-handle").textContent = p.username ? "@" + p.username : "@user";
      $("about-text").textContent = p.bio || "No bio yet.";
      $("share-url").textContent = "profile.html?u=" + (p.username || "username");

      const av = $("pf-avatar");
      av.src = p.avatar_url || DEFAULT_AVATAR;
      av.onerror = () => { av.src = DEFAULT_AVATAR; };

      const ban = $("pf-banner");
      if (p.banner_url) {
        ban.style.backgroundImage = "url('" + p.banner_url.replace(/'/g, "%27") + "')";
        ban.classList.add("has-wp");
      } else {
        ban.style.backgroundImage = "none";
        ban.classList.remove("has-wp");
      }

      // Stats placeholders (extend later from real counts)
      $("stat-messages").textContent = p.messages_count != null ? p.messages_count : "0";
      $("stat-media").textContent = p.media_count != null ? p.media_count : "0";
      $("stat-react").textContent = p.reaction_score != null ? p.reaction_score : "0";
      $("stat-tags").textContent = p.gang_tags != null ? p.gang_tags : "0";
      $("stat-awards").textContent = p.awards_count != null ? p.awards_count : "0";
    }

    async function loadOwn() {
      const { data, error } = await sb.from("profiles")
        .select("username, display_name, bio, avatar_url, stamp_url, banner_url, created_at")
        .eq("id", session.user.id)
        .maybeSingle();
      if (error) throw error;
      if (!data) {
        const base = (session.user.user_metadata?.username || session.user.email || "user")
          .split("@")[0].replace(/[^A-Za-z0-9_]/g, "_").slice(0, 24) || "user";
        await sb.from("profiles").upsert({ id: session.user.id, username: base, display_name: base });
        $("username").value = base;
        $("display-name").value = base;
        $("bio").value = "";
        paint({ username: base, display_name: base });
        return;
      }
      $("username").value = data.username || "";
      $("display-name").value = data.display_name || "";
      $("bio").value = data.bio || "";
      paint(data);
    }

    async function loadPublic(username) {
      const { data, error } = await sb.from("profiles")
        .select("username, display_name, bio, avatar_url, stamp_url, banner_url, created_at")
        .eq("username", username)
        .maybeSingle();
      if (error) throw error;
      if (!data) {
        paint({ username, display_name: "NOT FOUND", bio: "This profile does not exist." });
        return;
      }
      paint(data);
    }

    async function uploadImage(file, basename) {
      if (!file) return null;
      if (file.size > 2.5 * 1024 * 1024) throw new Error("Image too large (max ~2 MB)");
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const path = session.user.id + "/" + basename + "." + ext;
      const { error } = await sb.storage.from(AVATAR_BUCKET).upload(path, file, {
        upsert: true,
        contentType: file.type || "image/jpeg",
        cacheControl: "3600"
      });
      if (error) throw error;
      const { data } = sb.storage.from(AVATAR_BUCKET).getPublicUrl(path);
      return data.publicUrl + "?t=" + Date.now();
    }

    $("avatar-file").addEventListener("change", () => {
      const f = $("avatar-file").files?.[0];
      if (f) $("pf-avatar").src = URL.createObjectURL(f);
    });
    $("banner-file").addEventListener("change", () => {
      const f = $("banner-file").files?.[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      $("pf-banner").style.backgroundImage = "url('" + url + "')";
      $("pf-banner").classList.add("has-wp");
    });

    $("form-profile").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!session) return;
      const btn = $("btn-save");
      btn.disabled = true;
      setStatus("Saving…");
      try {
        const username = $("username").value.trim();
        const display_name = $("display-name").value.trim();
        const bio = $("bio").value.trim();
        if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) throw new Error("Username: 3–24 letters/numbers/_");
        let avatar_url, banner_url;
        const af = $("avatar-file").files?.[0];
        const bf = $("banner-file").files?.[0];
        if (af) { setStatus("Uploading avatar…"); avatar_url = await uploadImage(af, "avatar"); }
        if (bf) { setStatus("Uploading banner…"); banner_url = await uploadImage(bf, "banner"); }
        const payload = {
          id: session.user.id,
          username,
          display_name: display_name || username,
          bio: bio || null
        };
        if (avatar_url) payload.avatar_url = avatar_url;
        if (banner_url) payload.banner_url = banner_url;
        const { error } = await sb.from("profiles").upsert(payload);
        if (error) {
          // banner_url column might not exist yet — retry without it
          if (banner_url && /banner_url/i.test(error.message || "")) {
            delete payload.banner_url;
            const r2 = await sb.from("profiles").upsert(payload);
            if (r2.error) throw r2.error;
            setStatus("Saved (add banner_url column in Supabase for wallpapers)", "ok");
          } else throw error;
        } else {
          setStatus("Profile saved.", "ok");
        }
        $("avatar-file").value = "";
        $("banner-file").value = "";
        await loadOwn();
      } catch (err) {
        setStatus(err.message || "Save failed", "error");
      } finally {
        btn.disabled = false;
      }
    });

    document.querySelectorAll(".pf-tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pf-tabs button").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        const tab = btn.getAttribute("data-tab");
        ["about","activity","posts","media","awards","edit"].forEach(t => {
          const el = $("tab-" + t);
          if (el) el.classList.toggle("hidden", t !== tab);
        });
      });
    });

    $("btn-edit-banner").addEventListener("click", () => {
      const editBtn = $("tab-edit-btn");
      if (editBtn && !editBtn.classList.contains("hidden")) {
        editBtn.click();
        $("banner-file").click();
      }
    });

    $("btn-report").addEventListener("click", () => alert("Report received (placeholder)."));
    $("btn-dm").addEventListener("click", () => alert("DM coming soon."));
    $("btn-find").addEventListener("click", () => alert("Find menu placeholder."));

    (async () => {
      const params = new URLSearchParams(location.search);
      const publicUser = (params.get("u") || params.get("user") || "").trim();
      const { data } = await sb.auth.getSession();
      session = data.session;

      if (session) {
        $("tab-edit-btn").classList.remove("hidden");
        $("btn-edit-banner").classList.remove("hidden");
      }

      try {
        if (publicUser) {
          await loadPublic(publicUser);
          if (session) {
            const { data: me } = await sb.from("profiles").select("username").eq("id", session.user.id).maybeSingle();
            if (me && me.username && me.username.toLowerCase() === publicUser.toLowerCase()) {
              await loadOwn();
            }
          }
        } else if (session) {
          await loadOwn();
        } else {
          paint({ display_name: "USER", username: "guest", bio: "Sign in to create your profile.\nOr open profile.html?u=someone" });
        }
      } catch (e) {
        $("about-text").textContent = e.message || "Failed to load";
      }
    })();
  </script>
  <script src="esmaiwol-chrome.js" defer></script>
</body>
</html>
