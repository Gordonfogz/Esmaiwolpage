<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050509">
  <title>CHAT // FORUMS BASE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050509;
      --blue: #1768ff;
      --green: #00ff83;
      --text: #cbd5ff;
      --muted: #91b7bb;
      --border: #164cff;
      --red: #ff6d86;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.45;
      background-color: #0a0a12;
      background-image: url('forum-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.5);
      pointer-events: none;
      z-index: 0;
    }
    a { color: #7eb6ff; }
    a:hover { color: var(--green); }
    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, calc(100% - 16px));
      height: calc(100vh - 20px);
      margin: 10px auto;
      display: flex;
      flex-direction: column;
      border: 3px solid #3a5f8a;
      border-top-color: #9ec0e8;
      border-left-color: #7aa3d4;
      border-right-color: #1e3a5c;
      border-bottom-color: #1a334f;
      box-shadow: inset 1px 1px 0 #c5dbf5, 4px 4px 0 rgba(0,0,0,0.45);
      background: #0a1220;
      overflow: hidden;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: linear-gradient(180deg, #6ba3e0 0%, #2b6cb0 45%, #1a4a8a 100%);
      border-bottom: 2px solid #0a1a30;
      flex-shrink: 0;
    }
    header .logo {
      height: 26px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
    }
    header .userbar {
      color: #dceaff;
      font-size: 12px;
      font-family: Tahoma, sans-serif;
      margin-left: auto;
    }
    header .userbar a { color: #b8e0ff; }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      padding: 6px 10px;
      background: linear-gradient(180deg, #1a2a44, #101c30);
      border-bottom: 1px solid #1a334f;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }
    .nav a::before { content: "[ "; color: var(--text); }
    .nav a::after { content: " ]"; color: var(--text); }
    .rooms {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      background: #101c30;
      border-bottom: 1px solid #1a334f;
      flex-shrink: 0;
    }
    .room-tab {
      border: 1px solid #3a5f8a;
      background: #152033;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .room-tab.active {
      background: linear-gradient(180deg, #2b6cb0, #1a4a8a);
      color: #fff;
      border-color: #8eb4de;
    }
    .body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
    }
    @media (max-width: 720px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px;
      background: rgba(8, 12, 22, 0.92);
    }
    .msg {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .msg-av {
      width: 36px;
      height: 36px;
      border-radius: 3px;
      border: 1px solid #3a5f8a;
      object-fit: cover;
      background: #03040a;
    }
    .msg-av.ph {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }
    .msg-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
    }
    .msg .who {
      font-weight: bold;
      color: var(--green);
    }
    .msg .when {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }
    .msg .text { color: var(--text); white-space: pre-wrap; }
    .msg .quote {
      margin: 4px 0 6px;
      padding: 6px 8px;
      border-left: 3px solid #3a5f8a;
      background: linear-gradient(90deg, #1a2a40, transparent);
      color: #a8c0e0;
      font-size: 12px;
    }
    .msg-media {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .msg-media img {
      max-width: min(100%, 320px);
      max-height: 240px;
      border: 1px solid #3a5f8a;
      background: #000;
      cursor: pointer;
    }
    .msg-media video {
      max-width: min(100%, 360px);
      max-height: 240px;
      border: 1px solid #3a5f8a;
      background: #000;
    }
    .msg-media audio { width: min(100%, 280px); }
    .msg-media a.file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid #3a5f8a;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      background: #0c1524;
    }
    .msg-media a.file-chip:hover { border-color: var(--green); color: var(--green); }
    .sys {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      margin: 6px 0;
    }
    .sidebar {
      border-left: 2px solid #1a334f;
      background: #0c1524;
      overflow-y: auto;
      padding: 8px;
    }
    .sidebar h3 {
      margin: 0 0 8px;
      font-size: 11px;
      color: #fff;
      font-family: Tahoma, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .user-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      font-size: 12px;
      color: var(--green);
    }
    .user-row img {
      width: 22px;
      height: 22px;
      border-radius: 2px;
      object-fit: cover;
      border: 1px solid #3a5f8a;
      background: #03040a;
    }
    .user-row .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
      flex-shrink: 0;
    }
    .user-row .dot.off { background: #556; box-shadow: none; }
    .compose {
      flex-shrink: 0;
      border-top: 2px solid #1a334f;
      background: #101c30;
      padding: 8px 10px;
    }
    .compose-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
      align-items: center;
    }
    .compose-bar button, .compose-bar label.file-btn {
      border: 1px solid #3a5f8a;
      background: #152033;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
      display: inline-block;
    }
    .compose-bar button:hover, .compose-bar label.file-btn:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .compose-bar input[type="file"] { display: none; }
    .compose-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .compose-row textarea {
      flex: 1;
      min-height: 52px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid #3a5f8a;
      background: #03040a;
      color: var(--text);
      font: inherit;
      padding: 8px;
      outline: none;
    }
    .compose-row textarea:focus { border-color: var(--green); }
    .compose-row button.send {
      border: 1px solid var(--blue);
      background: #0a1025;
      color: var(--green);
      font: inherit;
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .compose-row button.send:disabled { opacity: 0.5; cursor: wait; }
    .attach-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .attach-preview .chip {
      font-size: 11px;
      border: 1px solid #3a5f8a;
      padding: 3px 7px;
      color: var(--muted);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-line {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      min-height: 14px;
    }
    .status-line.error { color: var(--red); }
    .gate {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
    }
    .hidden { display: none !important; }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.on { display: flex; }
    .lightbox img { max-width: 92%; max-height: 92%; border: 1px solid #3a5f8a; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <img class="logo" src="forums-base.png" alt="FORUMS BASE" onerror="this.style.display='none'">
      <div class="userbar" id="userbar">Checking session…</div>
    </header>
    <nav class="nav">
      <a href="index.html">INDEX</a>
      <a href="forum.html">FORUM</a>
      <a href="chat.html">CHAT</a>
      <a href="profile.html">PROFILE</a>
      <a href="login.html">LOGIN</a>
      <a href="#" id="nav-logout" class="hidden">LOGOUT</a>
    </nav>

    <div id="gate" class="gate hidden">
      You must <a href="login.html">login</a> to enter the chat.
    </div>

    <div id="chat-ui" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
      <div class="rooms" id="rooms"></div>
      <div class="body">
        <div class="messages" id="messages"></div>
        <aside class="sidebar">
          <h3>Online</h3>
          <div id="online-list"></div>
        </aside>
      </div>
      <div class="compose">
        <div class="compose-bar">
          <button type="button" id="btn-bold" title="Bold"><strong>B</strong></button>
          <button type="button" id="btn-italic" title="Italic"><em>I</em></button>
          <button type="button" id="btn-quote" title="Quote">“ ”</button>
          <button type="button" id="btn-link" title="Link">🔗</button>
          <button type="button" id="btn-imgurl" title="Image URL">🖼</button>
          <label class="file-btn" for="chat-files">📎 Attach</label>
          <input id="chat-files" type="file" accept="image/*,.gif,.webp,video/mp4,video/webm,audio/*,.pdf,.txt,.zip" multiple>
        </div>
        <div class="compose-row">
          <textarea id="input" placeholder="Write a message… (Shift+Enter = new line)" maxlength="2000"></textarea>
          <button type="button" class="send" id="btn-send">SEND</button>
        </div>
        <div class="attach-preview" id="attach-preview"></div>
        <div class="status-line" id="status"></div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('on')">
    <img id="lightbox-img" alt="Full size">
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const MEDIA_BUCKET = "forum-media";
    const MAX_FILES = 4;
    const MAX_BYTES = 4 * 1024 * 1024;
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_ROOMS = [
      { id: "general", title: "General" },
      { id: "cafe", title: "Cafe" },
      { id: "containment", title: "Containment" }
    ];

    let session = null;
    let profile = null;
    let currentRoom = "general";
    let channel = null;
    let presenceChannel = null;
    let rooms = DEFAULT_ROOMS.slice();

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str ?? "";
      return d.innerHTML;
    }

    function setStatus(msg, isError) {
      const el = $("status");
      el.textContent = msg || "";
      el.className = "status-line" + (isError ? " error" : "");
    }

    function fmtTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      return (n / 1048576).toFixed(1) + " MB";
    }

    function openLightbox(src) {
      $("lightbox-img").src = src;
      $("lightbox").classList.add("on");
    }
    window.openLightbox = openLightbox;

    function formatText(text) {
      let s = escapeHtml(text || "");
      s = s.replace(/^&gt; ?(.*)$/gm, '<div class="quote">$1</div>');
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
      // markdown images
      s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g,
        '<div class="msg-media"><img src="$2" alt="$1" onclick="openLightbox(this.src)"></div>');
      // markdown links
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // bare URLs (images)
      s = s.replace(/(?<!["'=])(https?:\/\/\S+\.(?:png|jpe?g|gif|webp)(?:\?\S*)?)/gi,
        '<div class="msg-media"><img src="$1" alt="" onclick="openLightbox(this.src)"></div>');
      // bare URLs (other)
      s = s.replace(/(?<!["'=])(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>');
      return s;
    }

    function renderAttachments(atts) {
      if (!atts || !atts.length) return "";
      let html = '<div class="msg-media">';
      for (const a of atts) {
        const type = a.type || "";
        const url = a.url || "";
        const name = a.name || "file";
        if (type.startsWith("image/")) {
          html += '<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(name) + '" onclick="openLightbox(this.src)">';
        } else if (type.startsWith("video/")) {
          html += '<video controls src="' + escapeHtml(url) + '"></video>';
        } else if (type.startsWith("audio/")) {
          html += '<audio controls src="' + escapeHtml(url) + '"></audio>';
        } else {
          html += '<a class="file-chip" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">📎 ' +
            escapeHtml(name) + (a.size ? " (" + formatBytes(a.size) + ")" : "") + "</a>";
        }
      }
      return html + "</div>";
    }

    function displayName() {
      return profile?.display_name || profile?.username || session?.user?.email?.split("@")[0] || "user";
    }

    function avatarUrl() {
      return profile?.avatar_url || "";
    }

    async function refreshSession() {
      const { data } = await sb.auth.getSession();
      session = data.session || null;
      profile = null;
      if (session?.user) {
        const { data: p } = await sb.from("profiles")
          .select("username, display_name, avatar_url")
          .eq("id", session.user.id)
          .maybeSingle();
        profile = p;
      }
      renderUserbar();
      if (!session) {
        $("gate").classList.remove("hidden");
        $("chat-ui").classList.add("hidden");
        $("chat-ui").style.display = "none";
        teardownRealtime();
      } else {
        $("gate").classList.add("hidden");
        $("chat-ui").classList.remove("hidden");
        $("chat-ui").style.display = "flex";
        await bootChat();
      }
    }

    function renderUserbar() {
      const bar = $("userbar");
      const logout = $("nav-logout");
      if (session?.user) {
        bar.innerHTML = 'Signed in as <strong>' + escapeHtml(displayName()) + '</strong>';
        logout.classList.remove("hidden");
      } else {
        bar.innerHTML = 'Not signed in — <a href="login.html">login</a>';
        logout.classList.add("hidden");
      }
    }

    function renderRooms() {
      const box = $("rooms");
      box.innerHTML = rooms.map(r =>
        '<button type="button" class="room-tab' + (r.id === currentRoom ? ' active' : '') +
        '" data-room="' + escapeHtml(r.id) + '">' + escapeHtml(r.title) + '</button>'
      ).join("");
      box.querySelectorAll(".room-tab").forEach(btn => {
        btn.addEventListener("click", () => switchRoom(btn.getAttribute("data-room")));
      });
    }

    function renderMessage(m) {
      const who = m.username || "user";
      const av = m.avatar_url || "";
      const div = document.createElement("div");
      div.className = "msg";
      div.dataset.id = m.id;
      const avHtml = av
        ? '<img class="msg-av" src="' + escapeHtml(av) + '" alt="">'
        : '<div class="msg-av ph">' + escapeHtml((who[0] || "?").toUpperCase()) + '</div>';
      div.innerHTML =
        avHtml +
        '<div class="msg-body">' +
          '<div class="msg-top">' +
            '<span class="who">' + escapeHtml(who) + '</span>' +
            '<span class="when">' + escapeHtml(fmtTime(m.created_at)) + '</span>' +
          '</div>' +
          '<div class="text">' + formatText(m.body) + '</div>' +
          renderAttachments(m.attachments || []) +
        '</div>';
      return div;
    }

    async function loadHistory() {
      const box = $("messages");
      box.innerHTML = '<div class="sys">Loading…</div>';
      let res = await sb.from("chat_messages")
        .select("id, room_id, user_id, username, avatar_url, body, attachments, created_at")
        .eq("room_id", currentRoom)
        .order("created_at", { ascending: true })
        .limit(150);
      if (res.error) {
        // fallback without new columns
        res = await sb.from("chat_messages")
          .select("id, room_id, user_id, username, body, created_at")
          .eq("room_id", currentRoom)
          .order("created_at", { ascending: true })
          .limit(150);
      }
      if (res.error) {
        box.innerHTML = '<div class="sys">Could not load messages: ' + escapeHtml(res.error.message) + '</div>';
        return;
      }
      const data = res.data || [];
      box.innerHTML = "";
      if (!data.length) {
        box.innerHTML = '<div class="sys">No messages yet. Say hello.</div>';
      } else {
        data.forEach(m => box.appendChild(renderMessage(m)));
      }
      box.scrollTop = box.scrollHeight;
    }

    function teardownRealtime() {
      if (channel) { sb.removeChannel(channel); channel = null; }
      if (presenceChannel) { sb.removeChannel(presenceChannel); presenceChannel = null; }
    }

    function setupRealtime() {
      teardownRealtime();

      channel = sb.channel("chat-" + currentRoom)
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "chat_messages",
          filter: "room_id=eq." + currentRoom
        }, (payload) => {
          const m = payload.new;
          if (!m) return;
          const box = $("messages");
          const sys = box.querySelector(".sys");
          if (sys) sys.remove();
          if (box.querySelector('[data-id="' + m.id + '"]')) return;
          box.appendChild(renderMessage(m));
          box.scrollTop = box.scrollHeight;
        })
        .subscribe();

      presenceChannel = sb.channel("presence-" + currentRoom, {
        config: { presence: { key: session.user.id } }
      });
      presenceChannel.on("presence", { event: "sync" }, () => {
        const state = presenceChannel.presenceState();
        const list = $("online-list");
        const users = [];
        Object.values(state).forEach(arr => {
          (arr || []).forEach(u => {
            if (u.username) users.push({ username: u.username, avatar_url: u.avatar_url || "" });
          });
        });
        // unique by username
        const map = new Map();
        users.forEach(u => map.set(u.username, u));
        const unique = [...map.values()].sort((a, b) => a.username.localeCompare(b.username));
        list.innerHTML = unique.length
          ? unique.map(u => {
              const av = u.avatar_url
                ? '<img src="' + escapeHtml(u.avatar_url) + '" alt="">'
                : '<span class="dot"></span>';
              return '<div class="user-row">' + av + escapeHtml(u.username) + '</div>';
            }).join("")
          : '<div class="user-row"><span class="dot off"></span><span style="color:var(--muted)">Nobody else</span></div>';
      });
      presenceChannel.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await presenceChannel.track({
            username: displayName(),
            user_id: session.user.id,
            avatar_url: avatarUrl(),
            online_at: new Date().toISOString()
          });
        }
      });
    }

    async function switchRoom(roomId) {
      if (roomId === currentRoom) return;
      currentRoom = roomId;
      renderRooms();
      await loadHistory();
      setupRealtime();
    }

    async function loadRooms() {
      const { data } = await sb.from("chat_rooms").select("id, title").order("id");
      if (data?.length) rooms = data;
      else rooms = DEFAULT_ROOMS.slice();
      if (!rooms.find(r => r.id === currentRoom)) currentRoom = rooms[0].id;
      renderRooms();
    }

    async function bootChat() {
      await loadRooms();
      await loadHistory();
      setupRealtime();
    }

    async function uploadAttachments(fileList) {
      const files = Array.from(fileList || []).slice(0, MAX_FILES);
      const out = [];
      for (const file of files) {
        if (file.size > MAX_BYTES) throw new Error(file.name + " exceeds 4 MB");
        const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "") || "bin";
        const path = "chat/" + session.user.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
        const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, file, {
          upsert: false,
          contentType: file.type || undefined,
          cacheControl: "3600"
        });
        if (error) throw new Error("Upload failed (" + file.name + "): " + error.message);
        const { data } = sb.storage.from(MEDIA_BUCKET).getPublicUrl(path);
        out.push({
          name: file.name,
          type: file.type || "application/octet-stream",
          size: file.size,
          url: data.publicUrl,
          path
        });
      }
      return out;
    }

    async function sendMessage() {
      if (!session) return;
      const ta = $("input");
      const body = ta.value.trim();
      const files = $("chat-files").files;
      if (!body && !(files && files.length)) return;
      const btn = $("btn-send");
      btn.disabled = true;
      setStatus("Sending…");
      try {
        let attachments = [];
        if (files && files.length) {
          setStatus("Uploading files…");
          attachments = await uploadAttachments(files);
        }
        const payload = {
          room_id: currentRoom,
          user_id: session.user.id,
          username: displayName(),
          avatar_url: avatarUrl() || null,
          body: body || (attachments.length ? "(attachment)" : ""),
          attachments
        };
        const { error } = await sb.from("chat_messages").insert(payload);
        if (error) throw error;
        ta.value = "";
        $("chat-files").value = "";
        $("attach-preview").innerHTML = "";
        setStatus("");
      } catch (err) {
        setStatus(err.message || "Send failed", true);
      } finally {
        btn.disabled = false;
        ta.focus();
      }
    }

    function wrapSelection(left, right) {
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      const e = ta.selectionEnd ?? 0;
      const sel = ta.value.slice(s, e) || "text";
      ta.value = ta.value.slice(0, s) + left + sel + right + ta.value.slice(e);
      ta.focus();
    }

    $("btn-send").addEventListener("click", sendMessage);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    $("btn-bold").addEventListener("click", () => wrapSelection("**", "**"));
    $("btn-italic").addEventListener("click", () => wrapSelection("*", "*"));
    $("btn-quote").addEventListener("click", () => {
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      const e = ta.selectionEnd ?? 0;
      const sel = ta.value.slice(s, e);
      const q = sel ? sel.split("\n").map(l => "> " + l).join("\n") : "> ";
      ta.value = ta.value.slice(0, s) + q + ta.value.slice(e);
      ta.focus();
    });
    $("btn-link").addEventListener("click", () => {
      const url = prompt("URL:", "https://");
      if (!url) return;
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      const e = ta.selectionEnd ?? 0;
      const sel = ta.value.slice(s, e) || "link";
      const insert = "[" + sel + "](" + url + ")";
      ta.value = ta.value.slice(0, s) + insert + ta.value.slice(e);
      ta.focus();
    });
    $("btn-imgurl").addEventListener("click", () => {
      const url = prompt("Image URL:", "https://");
      if (!url) return;
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      ta.value = ta.value.slice(0, s) + "![image](" + url + ")" + ta.value.slice(s);
      ta.focus();
    });
    $("chat-files").addEventListener("change", () => {
      const files = Array.from($("chat-files").files || []).slice(0, MAX_FILES);
      $("attach-preview").innerHTML = files.map(f =>
        '<span class="chip">' + escapeHtml(f.name) + " (" + formatBytes(f.size) + ")</span>"
      ).join("");
    });
    $("nav-logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      await refreshSession();
    });

    (async () => {
      await refreshSession();
      sb.auth.onAuthStateChange(() => { refreshSession(); });
    })();
  </script>
</body>
</html>
