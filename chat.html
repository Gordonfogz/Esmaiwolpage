<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050509">
  <title>CHAT // FORUMS BASE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050509;
      --blue: #1768ff;
      --green: #00ff83;
      --text: #cbd5ff;
      --muted: #91b7bb;
      --border: #164cff;
      --red: #ff6d86;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.45;
      background-color: #0a0a12;
      background-image: url('forum-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.5);
      pointer-events: none;
      z-index: 0;
    }
    a { color: #7eb6ff; }
    a:hover { color: var(--green); }
    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, calc(100% - 16px));
      height: calc(100vh - 20px);
      margin: 10px auto;
      display: flex;
      flex-direction: column;
      border: 3px solid #3a5f8a;
      border-top-color: #9ec0e8;
      border-left-color: #7aa3d4;
      border-right-color: #1e3a5c;
      border-bottom-color: #1a334f;
      box-shadow: inset 1px 1px 0 #c5dbf5, 4px 4px 0 rgba(0,0,0,0.45);
      background: #0a1220;
      overflow: hidden;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: linear-gradient(180deg, #6ba3e0 0%, #2b6cb0 45%, #1a4a8a 100%);
      border-bottom: 2px solid #0a1a30;
      flex-shrink: 0;
    }
    header .logo {
      height: 26px;
      width: auto;
      max-width: 200px;
      object-fit: contain;
    }
    header .userbar {
      color: #dceaff;
      font-size: 12px;
      font-family: Tahoma, sans-serif;
      margin-left: auto;
    }
    header .userbar a { color: #b8e0ff; }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      padding: 6px 10px;
      background: linear-gradient(180deg, #1a2a44, #101c30);
      border-bottom: 1px solid #1a334f;
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }
    .nav a::before { content: "[ "; color: var(--text); }
    .nav a::after { content: " ]"; color: var(--text); }
    .rooms {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      background: #101c30;
      border-bottom: 1px solid #1a334f;
      flex-shrink: 0;
    }
    .room-tab {
      border: 1px solid #3a5f8a;
      background: #152033;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .room-tab.active {
      background: linear-gradient(180deg, #2b6cb0, #1a4a8a);
      color: #fff;
      border-color: #8eb4de;
    }
    .room-tab .count {
      color: var(--green);
      font-size: 11px;
      margin-left: 4px;
    }
    .body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 200px;
    }
    @media (max-width: 720px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px;
      background: rgba(8, 12, 22, 0.92);
    }
    .msg {
      margin-bottom: 8px;
      word-break: break-word;
    }
    .msg .who {
      font-weight: bold;
      color: var(--green);
      margin-right: 6px;
    }
    .msg .when {
      float: right;
      font-size: 10px;
      color: var(--muted);
      margin-left: 8px;
    }
    .msg .text { color: var(--text); white-space: pre-wrap; }
    .msg .quote {
      margin: 4px 0 6px;
      padding: 6px 8px;
      border-left: 3px solid #3a5f8a;
      background: linear-gradient(90deg, #1a2a40, transparent);
      color: #a8c0e0;
      font-size: 12px;
    }
    .sys {
      color: var(--muted);
      font-size: 12px;
      font-style: italic;
      margin: 6px 0;
    }
    .sidebar {
      border-left: 2px solid #1a334f;
      background: #0c1524;
      overflow-y: auto;
      padding: 8px;
    }
    .sidebar h3 {
      margin: 0 0 8px;
      font-size: 11px;
      color: #fff;
      font-family: Tahoma, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .user-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      font-size: 12px;
      color: var(--green);
    }
    .user-row .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
      flex-shrink: 0;
    }
    .user-row .dot.off { background: #556; box-shadow: none; }
    .compose {
      flex-shrink: 0;
      border-top: 2px solid #1a334f;
      background: #101c30;
      padding: 8px 10px;
    }
    .compose-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .compose-bar button {
      border: 1px solid #3a5f8a;
      background: #152033;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      padding: 3px 8px;
      cursor: pointer;
    }
    .compose-bar button:hover { border-color: var(--green); color: var(--green); }
    .compose-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .compose-row textarea {
      flex: 1;
      min-height: 52px;
      max-height: 120px;
      resize: vertical;
      border: 1px solid #3a5f8a;
      background: #03040a;
      color: var(--text);
      font: inherit;
      padding: 8px;
      outline: none;
    }
    .compose-row textarea:focus { border-color: var(--green); }
    .compose-row button.send {
      border: 1px solid var(--blue);
      background: #0a1025;
      color: var(--green);
      font: inherit;
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .compose-row button.send:disabled { opacity: 0.5; cursor: wait; }
    .status-line {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      min-height: 14px;
    }
    .status-line.error { color: var(--red); }
    .gate {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <img class="logo" src="forums-base.png" alt="FORUMS BASE" onerror="this.style.display='none'">
      <div class="userbar" id="userbar">Checking session…</div>
    </header>
    <nav class="nav">
      <a href="index.html">INDEX</a>
      <a href="forum.html">FORUM</a>
      <a href="chat.html">CHAT</a>
      <a href="profile.html">PROFILE</a>
      <a href="login.html">LOGIN</a>
      <a href="#" id="nav-logout" class="hidden">LOGOUT</a>
    </nav>

    <div id="gate" class="gate hidden">
      You must <a href="login.html">login</a> to enter the chat.
    </div>

    <div id="chat-ui" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
      <div class="rooms" id="rooms"></div>
      <div class="body">
        <div class="messages" id="messages"></div>
        <aside class="sidebar">
          <h3>Online</h3>
          <div id="online-list"></div>
        </aside>
      </div>
      <div class="compose">
        <div class="compose-bar">
          <button type="button" id="btn-bold" title="Bold"><strong>B</strong></button>
          <button type="button" id="btn-italic" title="Italic"><em>I</em></button>
          <button type="button" id="btn-quote" title="Quote">“ ”</button>
        </div>
        <div class="compose-row">
          <textarea id="input" placeholder="Write a message…" maxlength="2000"></textarea>
          <button type="button" class="send" id="btn-send">SEND</button>
        </div>
        <div class="status-line" id="status"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oxgymzpvbpapsgmilenw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UzgjZ0LkU_qUtjZaRZPbcw_W5_r2p56";
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_ROOMS = [
      { id: "general", title: "General" },
      { id: "cafe", title: "Cafe" },
      { id: "containment", title: "Containment" }
    ];

    let session = null;
    let profile = null;
    let currentRoom = "general";
    let channel = null;
    let presenceChannel = null;
    let rooms = DEFAULT_ROOMS.slice();

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str ?? "";
      return d.innerHTML;
    }

    function setStatus(msg, isError) {
      const el = $("status");
      el.textContent = msg || "";
      el.className = "status-line" + (isError ? " error" : "");
    }

    function fmtTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch {
        return "";
      }
    }

    function formatText(text) {
      let s = escapeHtml(text || "");
      s = s.replace(/^&gt; ?(.*)$/gm, '<div class="quote">$1</div>');
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
      return s;
    }

    function displayName() {
      return profile?.display_name || profile?.username || session?.user?.email?.split("@")[0] || "user";
    }

    async function refreshSession() {
      const { data } = await sb.auth.getSession();
      session = data.session || null;
      profile = null;
      if (session?.user) {
        const { data: p } = await sb.from("profiles")
          .select("username, display_name")
          .eq("id", session.user.id)
          .maybeSingle();
        profile = p;
      }
      renderUserbar();
      if (!session) {
        $("gate").classList.remove("hidden");
        $("chat-ui").classList.add("hidden");
        $("chat-ui").style.display = "none";
        teardownRealtime();
      } else {
        $("gate").classList.add("hidden");
        $("chat-ui").classList.remove("hidden");
        $("chat-ui").style.display = "flex";
        await bootChat();
      }
    }

    function renderUserbar() {
      const bar = $("userbar");
      const logout = $("nav-logout");
      if (session?.user) {
        bar.innerHTML = 'Signed in as <strong>' + escapeHtml(displayName()) + '</strong>';
        logout.classList.remove("hidden");
      } else {
        bar.innerHTML = 'Not signed in — <a href="login.html">login</a>';
        logout.classList.add("hidden");
      }
    }

    function renderRooms() {
      const box = $("rooms");
      box.innerHTML = rooms.map(r =>
        '<button type="button" class="room-tab' + (r.id === currentRoom ? ' active' : '') +
        '" data-room="' + escapeHtml(r.id) + '">' + escapeHtml(r.title) + '</button>'
      ).join("");
      box.querySelectorAll(".room-tab").forEach(btn => {
        btn.addEventListener("click", () => switchRoom(btn.getAttribute("data-room")));
      });
    }

    function renderMessage(m) {
      const who = m.username || "user";
      const div = document.createElement("div");
      div.className = "msg";
      div.dataset.id = m.id;
      div.innerHTML =
        '<span class="when">' + escapeHtml(fmtTime(m.created_at)) + '</span>' +
        '<span class="who">' + escapeHtml(who) + ':</span>' +
        '<span class="text">' + formatText(m.body) + '</span>';
      return div;
    }

    async function loadHistory() {
      const box = $("messages");
      box.innerHTML = '<div class="sys">Loading…</div>';
      const { data, error } = await sb.from("chat_messages")
        .select("id, room_id, user_id, username, body, created_at")
        .eq("room_id", currentRoom)
        .order("created_at", { ascending: true })
        .limit(150);
      if (error) {
        box.innerHTML = '<div class="sys">Could not load messages: ' + escapeHtml(error.message) + '</div>';
        return;
      }
      box.innerHTML = "";
      if (!data?.length) {
        box.innerHTML = '<div class="sys">No messages yet. Say hello.</div>';
      } else {
        data.forEach(m => box.appendChild(renderMessage(m)));
      }
      box.scrollTop = box.scrollHeight;
    }

    function teardownRealtime() {
      if (channel) {
        sb.removeChannel(channel);
        channel = null;
      }
      if (presenceChannel) {
        sb.removeChannel(presenceChannel);
        presenceChannel = null;
      }
    }

    function setupRealtime() {
      teardownRealtime();

      channel = sb.channel("chat-" + currentRoom)
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "chat_messages",
          filter: "room_id=eq." + currentRoom
        }, (payload) => {
          const m = payload.new;
          if (!m) return;
          const box = $("messages");
          const sys = box.querySelector(".sys");
          if (sys) sys.remove();
          if (box.querySelector('[data-id="' + m.id + '"]')) return;
          box.appendChild(renderMessage(m));
          box.scrollTop = box.scrollHeight;
        })
        .subscribe();

      presenceChannel = sb.channel("presence-" + currentRoom, {
        config: { presence: { key: session.user.id } }
      });
      presenceChannel.on("presence", { event: "sync" }, () => {
        const state = presenceChannel.presenceState();
        const list = $("online-list");
        const users = [];
        Object.values(state).forEach(arr => {
          (arr || []).forEach(u => {
            if (u.username) users.push(u.username);
          });
        });
        const unique = [...new Set(users)].sort((a, b) => a.localeCompare(b));
        list.innerHTML = unique.length
          ? unique.map(n =>
              '<div class="user-row"><span class="dot"></span>' + escapeHtml(n) + '</div>'
            ).join("")
          : '<div class="user-row"><span class="dot off"></span><span style="color:var(--muted)">Nobody else</span></div>';
      });
      presenceChannel.subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await presenceChannel.track({
            username: displayName(),
            user_id: session.user.id,
            online_at: new Date().toISOString()
          });
        }
      });
    }

    async function switchRoom(roomId) {
      if (roomId === currentRoom) return;
      currentRoom = roomId;
      renderRooms();
      await loadHistory();
      setupRealtime();
    }

    async function loadRooms() {
      const { data } = await sb.from("chat_rooms").select("id, title").order("id");
      if (data?.length) rooms = data;
      else rooms = DEFAULT_ROOMS.slice();
      if (!rooms.find(r => r.id === currentRoom)) currentRoom = rooms[0].id;
      renderRooms();
    }

    async function bootChat() {
      await loadRooms();
      await loadHistory();
      setupRealtime();
    }

    async function sendMessage() {
      if (!session) return;
      const ta = $("input");
      const body = ta.value.trim();
      if (!body) return;
      const btn = $("btn-send");
      btn.disabled = true;
      setStatus("Sending…");
      try {
        const { error } = await sb.from("chat_messages").insert({
          room_id: currentRoom,
          user_id: session.user.id,
          username: displayName(),
          body
        });
        if (error) throw error;
        ta.value = "";
        setStatus("");
      } catch (err) {
        setStatus(err.message || "Send failed", true);
      } finally {
        btn.disabled = false;
        ta.focus();
      }
    }

    function wrapSelection(left, right) {
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      const e = ta.selectionEnd ?? 0;
      const sel = ta.value.slice(s, e) || "text";
      ta.value = ta.value.slice(0, s) + left + sel + right + ta.value.slice(e);
      ta.focus();
    }

    $("btn-send").addEventListener("click", sendMessage);
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    $("btn-bold").addEventListener("click", () => wrapSelection("**", "**"));
    $("btn-italic").addEventListener("click", () => wrapSelection("*", "*"));
    $("btn-quote").addEventListener("click", () => {
      const ta = $("input");
      const s = ta.selectionStart ?? 0;
      const e = ta.selectionEnd ?? 0;
      const sel = ta.value.slice(s, e);
      const q = sel ? sel.split("\n").map(l => "> " + l).join("\n") : "> ";
      ta.value = ta.value.slice(0, s) + q + ta.value.slice(e);
      ta.focus();
    });
    $("nav-logout").addEventListener("click", async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      await refreshSession();
    });

    (async () => {
      await refreshSession();
      sb.auth.onAuthStateChange(() => { refreshSession(); });
    })();
  </script>
</body>
</html>
